<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手続き・備品ログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<style>
:root{
  --bg:#f2f4f1;--surface:#fff;--ink:#1a211e;--ink2:#3a4540;--muted:#6b7872;
  --line:#dde2de;--faint:#f0f3f0;--hover:#eaf3ee;
  --accent:#1a6b53;--accent2:#2d8f6f;--accent-soft:#e0eeea;--accent-ink:#fff;
  --c-order:#1e5ba8;--c-order-bg:#e5edf8;
  --c-change:#6b3fa8;--c-change-bg:#ede7f6;
  --c-setup:#1a6b53;--c-setup-bg:#e0eeea;
  --c-lend:#8a570a;--c-lend-bg:#f5ecda;
  --c-return:#4a5750;--c-return-bg:#e8ece9;
  --c-repair:#a84220;--c-repair-bg:#f6e6df;
  --c-cancel:#a82030;--c-cancel-bg:#f6e0e3;
  --c-supply:#3a7a3a;--c-supply-bg:#e3f0e3;
  --c-warn:#a85f00;--c-warn-bg:#fdf0dc;
  --r:12px;
  --f:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111714;--surface:#182018;--ink:#e5ece7;--ink2:#c0ccc3;--muted:#88978f;
  --line:#263029;--faint:#1e2820;--hover:#1f3028;
  --accent:#4db896;--accent-soft:#1a3530;--accent-ink:#0a1a14;
  --c-order:#7aaae8;--c-order-bg:#1a2a40;--c-change:#b897e0;--c-change-bg:#271a3a;
  --c-setup:#4db896;--c-setup-bg:#1a3530;--c-lend:#d8a855;--c-lend-bg:#302010;
  --c-return:#9eaaa3;--c-return-bg:#232c27;--c-repair:#e0845a;--c-repair-bg:#301a10;
  --c-cancel:#e0606e;--c-cancel-bg:#301015;--c-supply:#7ab87a;--c-supply-bg:#1a301a;
  --c-warn:#e0a040;--c-warn-bg:#302010;
  color-scheme:dark;
}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:20px 14px 100px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ヘッダー */
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
h1{font-size:19px;font-weight:700}
.hbtns{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;white-space:nowrap;transition:border-color .15s;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:14px;padding:8px 18px}
.btn.danger{color:var(--c-cancel);border-color:var(--c-cancel)}
.btn.ghost{border-color:transparent;background:transparent}

/* タブ */
.tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:14px;width:fit-content}
.tabs button{border:0;border-right:1px solid var(--line);background:transparent;padding:8px 18px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cnt{font-size:11px;margin-left:3px;opacity:.7}

/* リスト */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s;align-items:center}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
.row-title{font-weight:600;font-size:13.5px}
.row-sub{font-size:12px;color:var(--muted)}
.row-meta{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap;line-height:1.4}

/* 納品照合バナー */
.verify-banner{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:8px}
.verify-ok{background:var(--c-setup-bg);color:var(--c-setup)}
.verify-ng{background:var(--c-cancel-bg);color:var(--c-cancel)}
.verify-warn{background:var(--c-warn-bg);color:var(--c-warn)}

/* ダイアログ */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);box-shadow:0 8px 40px rgb(0 0 0/.18);width:min(96vw,520px);max-height:92dvh;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
dialog::backdrop{background:rgb(0 0 0/.45)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}
.dlg-head h2{font-size:16px;font-weight:700}
form{overflow-y:auto;padding:14px 20px 24px;display:grid;gap:11px}
label.f{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
label.f input,label.f select,label.f textarea{
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;
  background:var(--faint);color:var(--ink);font-size:15px;width:100%
}
label.f textarea{resize:vertical;min-height:56px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* セグメント選択 */
.seg-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{cursor:pointer}
.seg label input[type=radio]{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.seg label span{
  display:inline-block;padding:7px 14px;border:1.5px solid var(--line);
  border-radius:8px;font-size:13px;font-weight:600;transition:all .12s;
  background:var(--surface);white-space:nowrap;user-select:none
}
.seg label:has(input:checked) span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* アクション選択 */
.act-seg{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
.act-seg label span{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 6px;border:1.5px solid var(--line);border-radius:10px;
  font-size:12.5px;font-weight:700;text-align:center;min-height:52px;
  background:var(--surface);transition:all .12s;white-space:nowrap;user-select:none
}
.act-seg label input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.act-seg label[data-ac="発注"]:has(input:checked) span{background:var(--c-order-bg);color:var(--c-order);border-color:var(--c-order)}
.act-seg label[data-ac="機種変更"]:has(input:checked) span{background:var(--c-change-bg);color:var(--c-change);border-color:var(--c-change)}
.act-seg label[data-ac="初期設定"]:has(input:checked) span{background:var(--c-setup-bg);color:var(--c-setup);border-color:var(--c-setup)}
.act-seg label[data-ac="貸与"]:has(input:checked) span{background:var(--c-lend-bg);color:var(--c-lend);border-color:var(--c-lend)}
.act-seg label[data-ac="返却"]:has(input:checked) span{background:var(--c-return-bg);color:var(--c-return);border-color:var(--c-return)}
.act-seg label[data-ac="修理"]:has(input:checked) span{background:var(--c-repair-bg);color:var(--c-repair);border-color:var(--c-repair)}
.act-seg label[data-ac="解約"]:has(input:checked) span{background:var(--c-cancel-bg);color:var(--c-cancel);border-color:var(--c-cancel)}

.factions{display:flex;gap:8px;justify-content:flex-end;padding-top:4px;flex-wrap:wrap}
.factions .left{margin-right:auto}

/* FAB */
.fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0));right:20px;
  width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);
  color:var(--accent-ink);font-size:28px;box-shadow:0 4px 16px rgb(0 0 0/.22);
  display:flex;align-items:center;justify-content:center;z-index:100;transition:transform .15s}
.fab:active{transform:scale(.92)}
@media(min-width:700px){.fab{display:none}}

/* QR */
.qr-overlay{position:fixed;inset:0;background:rgb(0 0 0/.5);z-index:200;display:none;align-items:center;justify-content:center}
.qr-overlay.open{display:flex}
.qr-box{background:var(--surface);border-radius:16px;padding:28px 32px;text-align:center;display:grid;gap:12px;max-width:290px;width:90vw}
.qr-box h3{font-size:15px;font-weight:700}
.qr-url{font-size:10.5px;color:var(--muted);word-break:break-all}

/* OCRゾーン */
.ocr-zone{background:var(--faint);border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.ocr-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ocr-pick{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 8px;
  border:1.5px solid var(--accent);border-radius:10px;cursor:pointer;
  font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft)}
.ocr-pick:hover{background:var(--hover)}
.ocr-preview{position:relative;display:none}
.ocr-preview img{width:100%;max-height:160px;object-fit:contain;border-radius:8px;border:1px solid var(--line)}
.ocr-clear{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;
  background:rgb(0 0 0/.55);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ocr-result{display:none;padding:8px 10px;background:var(--accent-soft);border-radius:8px;font-size:12px;border:1px solid var(--accent)}
.ocr-dl-btn{width:100%;padding:10px;border:0;border-radius:8px;background:var(--c-order);color:#fff;
  font-size:13px;font-weight:700;cursor:pointer;margin-top:6px}

/* 納品照合セクション */
.verify-section{background:var(--faint);border:1.5px solid var(--c-warn);border-radius:12px;padding:12px;display:grid;gap:8px}
.verify-section h4{font-size:13px;font-weight:700;color:var(--c-warn)}

@media(max-width:600px){
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
  .dlg-head{padding:14px 16px 0}
  form{padding:12px 16px 20px}
  label.f input,label.f select{font-size:16px}
  .factions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;margin:0 -16px;z-index:10}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hdr">
    <h1>📋 手続き・備品ログ</h1>
    <div class="hbtns">
      <button class="btn" id="btnLog" type="button">🔒 通信</button>
      <button class="btn" id="btnQr" type="button">QR</button>
      <button class="btn" id="btnExcel" type="button">📥 Excel</button>
      <button class="btn primary" id="btnNew" type="button">＋ 記録する</button>
    </div>
  </header>

  <!-- タブ -->
  <div class="tabs" id="mainTabs">
    <button type="button" data-m="device" aria-pressed="true">端末・ライセンス<span class="cnt" id="cntD">0</span></button>
    <button type="button" data-m="supply" aria-pressed="false">備品・消耗品<span class="cnt" id="cntS">0</span></button>
  </div>

  <!-- リスト -->
  <div class="card" id="list"></div>
</div>

<!-- FAB -->
<button class="fab" id="fab" type="button">＋</button>

<!-- QR -->
<div class="qr-overlay" id="qrOverlay">
  <div class="qr-box">
    <h3>このページのQRコード</h3>
    <div id="qrcode"></div>
    <p class="qr-url" id="qrUrl"></p>
    <button class="btn" id="qrClose" type="button">閉じる</button>
  </div>
</div>

<!-- フォームダイアログ -->
<dialog id="dlg">
  <div class="dlg-head">
    <div style="display:flex;flex-direction:column;gap:8px">
      <h2 id="dlgTitle">記録する</h2>
      <div class="tabs" id="frmTabs" style="margin:0">
        <button type="button" data-fm="device" aria-pressed="true">端末</button>
        <button type="button" data-fm="supply" aria-pressed="false">備品</button>
      </div>
    </div>
    <button class="btn ghost" type="button" id="btnDlgX" style="font-size:18px;padding:4px 8px">✕</button>
  </div>

  <form id="frm" method="dialog">

    <!-- ===== 端末セクション ===== -->
    <div id="secDevice">
      <div style="margin-bottom:11px">
        <div class="seg-label">種別</div>
        <div class="seg" id="segCat">
          <label><input type="radio" name="cat" value="携帯"><span>📱 携帯</span></label>
          <label><input type="radio" name="cat" value="ポケットWi-Fi"><span>📶 Wi-Fi</span></label>
          <label><input type="radio" name="cat" value="PC"><span>💻 PC</span></label>
          <label><input type="radio" name="cat" value="Microsoft 365"><span>🪟 M365</span></label>
        </div>
      </div>
      <div style="margin-bottom:11px">
        <div class="seg-label">手続き</div>
        <div class="act-seg" id="segAct">
          <label data-ac="発注"><input type="radio" name="act" value="発注"><span>📦<br>発注</span></label>
          <label data-ac="機種変更"><input type="radio" name="act" value="機種変更"><span>🔄<br>機種変更</span></label>
          <label data-ac="初期設定"><input type="radio" name="act" value="初期設定"><span>⚙️<br>初期設定</span></label>
          <label data-ac="貸与"><input type="radio" name="act" value="貸与"><span>🤝<br>貸与</span></label>
          <label data-ac="返却"><input type="radio" name="act" value="返却"><span>↩️<br>返却</span></label>
          <label data-ac="修理"><input type="radio" name="act" value="修理"><span>🔧<br>修理</span></label>
          <label data-ac="解約"><input type="radio" name="act" value="解約"><span>🚫<br>解約</span></label>
        </div>
      </div>
      <div style="margin-bottom:11px">
        <div class="seg-label">部署</div>
        <div class="seg" id="segDept"></div>
      </div>
      <div class="grid2">
        <label class="f">氏名<input id="iName" placeholder="山田 太郎" autocomplete="off" inputmode="text"></label>
        <label class="f">端末番号<input id="iNo" placeholder="090-XXXX-XXXX" autocomplete="off" inputmode="tel"></label>
      </div>
      <label class="f">機種名<input id="iModel" placeholder="iPhone 16 Pro など" autocomplete="off"></label>
      <div class="grid2">
        <label class="f">日付<input type="date" id="iDate"></label>
        <div>
          <div class="seg-label">状態</div>
          <div class="seg">
            <label><input type="radio" name="status" value="手配中"><span>手配中</span></label>
            <label><input type="radio" name="status" value="完了"><span>✓ 完了</span></label>
          </div>
        </div>
      </div>
      <label class="f">メモ（任意）<textarea id="iMemo" rows="2" placeholder="備考など"></textarea></label>
    </div>

    <!-- ===== 備品セクション ===== -->
    <div id="secSupply" hidden>

      <!-- ① 注文書 OCRゾーン -->
      <div class="ocr-zone" id="ocrOrderZone">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:12px;font-weight:700;color:var(--muted)">📄 注文書・請求書を読み取る</span>
          <span id="ocrOrderStatus" style="font-size:11px;color:var(--accent)"></span>
        </div>
        <div class="ocr-btns">
          <label class="ocr-pick">
            📷 カメラ撮影
            <input type="file" id="ocrOrderCamera" accept="image/*" capture="environment" style="display:none">
          </label>
          <label class="ocr-pick">
            📁 PDF / 画像
            <input type="file" id="ocrOrderFile" accept="image/*,application/pdf" style="display:none">
          </label>
        </div>
        <div class="ocr-preview" id="ocrOrderPreview">
          <img id="ocrOrderImg" alt="注文書プレビュー">
          <button type="button" class="ocr-clear" data-zone="order">✕</button>
        </div>
        <div class="ocr-result" id="ocrOrderResult">
          <div style="font-weight:700;color:var(--accent);margin-bottom:3px">✓ 読み取り完了 — フォームに自動入力しました</div>
          <div id="ocrOrderResultText" style="color:var(--ink2);line-height:1.8"></div>
          <button type="button" class="ocr-dl-btn" id="btnDlOrder" style="display:none"></button>
        </div>
      </div>

      <!-- 購入先 -->
      <div>
        <div class="seg-label">購入先</div>
        <div class="seg" id="segSupplier">
          <label><input type="radio" name="supplier" value="ASKUL"><span>ASKUL</span></label>
          <label><input type="radio" name="supplier" value="Amazon"><span>Amazon</span></label>
          <label><input type="radio" name="supplier" value="フォレストウェイ"><span>フォレストウェイ</span></label>
          <label><input type="radio" name="supplier" value="その他"><span>その他</span></label>
        </div>
      </div>

      <!-- 部署 -->
      <div>
        <div class="seg-label">部署</div>
        <div class="seg" id="segDeptS"></div>
      </div>

      <label class="f">品名<input id="iSName" placeholder="A4コピー用紙 など" autocomplete="off"></label>

      <div class="grid2">
        <label class="f">注文数量<input id="iQty" type="number" min="1" placeholder="1" inputmode="numeric"></label>
        <label class="f">注文金額（円）<input id="iAmt" type="number" min="0" placeholder="0" inputmode="numeric"></label>
      </div>

      <div class="grid2">
        <label class="f">注文日<input type="date" id="iSDate"></label>
        <label class="f">注文番号<input id="iOrderNo" placeholder="注文番号" autocomplete="off"></label>
      </div>

      <label class="f">メモ（任意）<textarea id="iSMemo" rows="2" placeholder="管理番号・用途など"></textarea></label>

      <!-- ② 納品照合ゾーン（編集時のみ表示） -->
      <div class="verify-section" id="verifySection" style="display:none">
        <h4>📦 納品書を照合する</h4>
        <!-- 照合結果 -->
        <div id="verifyResult" style="display:none"></div>
        <div class="ocr-zone" style="border:none;padding:0;background:transparent">
          <div class="ocr-btns">
            <label class="ocr-pick" style="border-color:var(--c-warn);color:var(--c-warn);background:var(--c-warn-bg)">
              📷 納品書を撮影
              <input type="file" id="ocrDelivCamera" accept="image/*" capture="environment" style="display:none">
            </label>
            <label class="ocr-pick" style="border-color:var(--c-warn);color:var(--c-warn);background:var(--c-warn-bg)">
              📁 PDF / 画像
              <input type="file" id="ocrDelivFile" accept="image/*,application/pdf" style="display:none">
            </label>
          </div>
          <div class="ocr-preview" id="ocrDelivPreview">
            <img id="ocrDelivImg" alt="納品書プレビュー">
            <button type="button" class="ocr-clear" data-zone="deliv">✕</button>
          </div>
          <div class="ocr-result" id="ocrDelivResult">
            <div id="ocrDelivResultText" style="line-height:1.8"></div>
            <button type="button" class="ocr-dl-btn" id="btnDlDeliv" style="display:none;background:var(--c-warn)"></button>
          </div>
        </div>
        <div class="grid2" style="margin-top:4px">
          <label class="f">納品数量<input id="iDelivQty" type="number" min="0" placeholder="0" inputmode="numeric"></label>
          <label class="f">納品金額（円）<input id="iDelivAmt" type="number" min="0" placeholder="0" inputmode="numeric"></label>
        </div>
        <label class="f">到着日<input type="date" id="iDelivDate"></label>
        <div>
          <div class="seg-label">状態</div>
          <div class="seg">
            <label><input type="radio" name="supplyStatus" value="発注済"><span>発注済</span></label>
            <label><input type="radio" name="supplyStatus" value="受取済"><span>✓ 受取済</span></label>
            <label><input type="radio" name="supplyStatus" value="差異あり"><span>⚠️ 差異あり</span></label>
          </div>
        </div>
      </div>

    </div>

    <div class="factions">
      <button class="btn danger left" type="button" id="btnDel" hidden>削除</button>
      <button class="btn ghost" type="button" id="btnCancel">キャンセル</button>
      <button class="btn primary" type="submit" id="btnSave">保存する</button>
    </div>
  </form>
</dialog>

<script>
/* ===== 定数 ===== */
const LS_LOGS = "devlog.logs";
const DEPTS_DEFAULT = ["本社","MB","KB","FB","BS","SB","CP","OS","HB","KM","EB","SE","YB","KE","DM","推進室"];

/* 電帳法 仕入先コードマップ */
const SUPPLIER_MAP = [
  { code:"ASKL", label:"ASKUL",       keys:["askul","アスクル"] },
  { code:"AMZN", label:"Amazon",      keys:["amazon","アマゾン"] },
  { code:"FRST", label:"フォレストウェイ", keys:["フォレストウェイ","forestway"] },
];
function supplierToCode(name){
  if(!name) return "OTHER";
  const n = name.toLowerCase();
  for(const s of SUPPLIER_MAP){ if(s.keys.some(k=>n.includes(k))) return s.code; }
  return "OTHER";
}
function supplierFromText(text){
  for(const s of SUPPLIER_MAP){ if(s.keys.some(k=>text.toLowerCase().includes(k))) return s.label; }
  return null;
}

const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const today = ()=>new Date().toISOString().slice(0,10);
const newId = ()=>"L"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtDate = d=>d?d.slice(5).replace('-','/'):"";

/* ===== 状態 ===== */
let logs  = [];
let depts = [...DEPTS_DEFAULT];
let mode  = "device";
let fMode = "device";
let editId = null;

/* ===== localStorage ===== */
function lsLoad(){
  try{
    const l = localStorage.getItem(LS_LOGS);
    if(l) logs = JSON.parse(l)||[];
  }catch(e){}
}
function lsSave(){
  try{ localStorage.setItem(LS_LOGS, JSON.stringify(logs)); }catch(e){}
}

/* ===== ログ操作（ローカルのみ・外部送信なし） ===== */
function saveLog(id, data){
  const row = {id,...data};
  const idx = logs.findIndex(l=>l.id===id);
  if(idx>=0) logs[idx]=row; else logs.unshift(row);
  lsSave(); render();
  addCommLog("保存", "localStorage", `ID:${id} をローカルに保存`);
}
function removeLog(id){
  logs = logs.filter(l=>l.id!==id);
  lsSave(); render();
  addCommLog("削除", "localStorage", `ID:${id} をローカルから削除`);
}

/* ===== バッジ色 ===== */
const ACOL = {発注:"order",機種変更:"change",初期設定:"setup",貸与:"lend",返却:"return",修理:"repair",解約:"cancel",購入:"supply"};
function badgeStyle(ac){
  const k = ACOL[ac]||"return";
  return `background:var(--c-${k}-bg);color:var(--c-${k});border:1px solid var(--c-${k})`;
}

/* ===== 描画 ===== */
function buildDeptSegs(){
  ["segDept","segDeptS"].forEach((id,i)=>{
    const el=$("#"+id); if(!el) return;
    const name=i===0?"dept":"deptS";
    el.innerHTML=depts.map(d=>`<label><input type="radio" name="${name}" value="${esc(d)}"><span>${esc(d)}</span></label>`).join("");
  });
}

function statusChip(status){
  if(!status) return "";
  const col = status==="受取済"||status==="完了" ? "var(--c-setup)" :
              status==="差異あり" ? "var(--c-cancel)" : "var(--muted)";
  return `<span style="font-size:10px;color:${col};font-weight:700">${esc(status)}</span>`;
}

function render(){
  const dLogs = logs.filter(l=>l.logType!=="supply");
  const sLogs = logs.filter(l=>l.logType==="supply");
  $("#cntD").textContent = dLogs.length;
  $("#cntS").textContent = sLogs.length;
  document.querySelectorAll("#mainTabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mode));

  const cur = mode==="supply" ? sLogs : dLogs;
  if(!cur.length){
    $("#list").innerHTML='<div class="empty">まだ記録がありません<br><span style="font-size:12px">「＋ 記録する」から登録してください</span></div>';
    return;
  }

  $("#list").innerHTML = cur.map(l=>{
    if(l.logType==="supply"){
      const title = l.sName||l.supplier||"—";
      const qty   = l.quantity ? `注文${l.quantity}個` : "";
      const amt   = l.amount   ? `¥${Number(l.amount).toLocaleString()}` : "";
      const dqty  = l.delivQty ? `納品${l.delivQty}個` : "";
      const sub   = [l.supplier, qty, amt, dqty].filter(Boolean).join(" · ");
      // 差異検出
      let diffBadge = "";
      if(l.delivQty!=null && l.quantity!=null && Number(l.delivQty)!==Number(l.quantity))
        diffBadge = `<span style="font-size:10px;font-weight:700;color:var(--c-cancel)"> ⚠️差異</span>`;
      if(l.delivAmt!=null && l.amount!=null && Number(l.delivAmt)!==Number(l.amount))
        diffBadge = `<span style="font-size:10px;font-weight:700;color:var(--c-cancel)"> ⚠️差異</span>`;
      return `<div class="row" data-id="${esc(l.id)}">
        <span class="badge" style="${badgeStyle("購入")}">購入</span>
        <div style="min-width:0">
          <div class="row-title">${esc(title)}${diffBadge}</div>
          ${sub?`<div class="row-sub">${esc(sub)}</div>`:""}
        </div>
        <div class="row-meta">${fmtDate(l.date)}<br>${statusChip(l.status)}</div>
      </div>`;
    } else {
      const name = l.name||"（氏名未入力）";
      const dept = l.dept||"";
      const sub  = [l.category, l.model, l.number].filter(Boolean).join(" · ");
      return `<div class="row" data-id="${esc(l.id)}">
        <span class="badge" style="${badgeStyle(l.action||"")}">${esc(l.action||"—")}</span>
        <div style="min-width:0">
          <div class="row-title" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span>${esc(name)}</span>
            ${dept?`<span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)">${esc(dept)}</span>`:""}
          </div>
          ${sub?`<div class="row-sub">${esc(sub)}</div>`:""}
        </div>
        <div class="row-meta">${fmtDate(l.date)}<br>${statusChip(l.status)}</div>
      </div>`;
    }
  }).join("");
}

/* ===== フォーム ===== */
function setFMode(m){
  fMode=m;
  $("#secDevice").hidden=m!=="device";
  $("#secSupply").hidden=m!=="supply";
  document.querySelectorAll("#frmTabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.fm===m));
}

function openForm(pre={}){
  editId = pre.id||null;
  const m = pre.logType==="supply"?"supply":"device";
  setFMode(m);
  buildDeptSegs();
  $("#dlgTitle").textContent = editId?"記録を編集":"記録する";
  $("#btnDel").hidden = !editId;

  // OCRゾーンリセット
  resetOcrZone("order");
  resetOcrZone("deliv");

  if(m==="device"){
    document.querySelectorAll('input[name=cat]').forEach(r=>r.checked=r.value===(pre.category||""));
    document.querySelectorAll('input[name=act]').forEach(r=>r.checked=r.value===(pre.action||""));
    document.querySelectorAll('input[name=dept]').forEach(r=>r.checked=r.value===(pre.dept||""));
    document.querySelectorAll('input[name=status]').forEach(r=>r.checked=r.value===(pre.status||"完了"));
    $("#iName").value  = pre.name||"";
    $("#iNo").value    = pre.number||"";
    $("#iModel").value = pre.model||"";
    $("#iDate").value  = pre.date||today();
    $("#iMemo").value  = pre.memo||"";
  } else {
    document.querySelectorAll('input[name=supplier]').forEach(r=>r.checked=r.value===(pre.supplier||""));
    document.querySelectorAll('input[name=deptS]').forEach(r=>r.checked=r.value===(pre.dept||""));
    document.querySelectorAll('input[name=supplyStatus]').forEach(r=>r.checked=r.value===(pre.status||"発注済"));
    $("#iSName").value  = pre.sName||"";
    $("#iQty").value    = pre.quantity||"";
    $("#iAmt").value    = pre.amount||"";
    $("#iSDate").value  = pre.date||today();
    $("#iOrderNo").value = pre.orderNo||"";
    $("#iSMemo").value  = pre.sMemo||"";
    // 納品照合ゾーン（編集時のみ表示）
    const vs = $("#verifySection");
    vs.style.display = editId ? "" : "none";
    if(editId){
      $("#iDelivQty").value  = pre.delivQty||"";
      $("#iDelivAmt").value  = pre.delivAmt||"";
      $("#iDelivDate").value = pre.deliveryDate||"";
      // 既存の差異表示
      showVerifyResult(pre);
    }
  }
  $("#dlg").showModal();
}

function showVerifyResult(log){
  const r = $("#verifyResult");
  if(!log.delivQty && !log.delivAmt){ r.style.display="none"; return; }
  const qtyOk = log.quantity==null || log.delivQty==null || Number(log.quantity)===Number(log.delivQty);
  const amtOk = log.amount==null   || log.delivAmt==null || Number(log.amount)===Number(log.delivAmt);
  if(qtyOk && amtOk){
    r.className="verify-banner verify-ok";
    r.textContent="✓ 注文数量・金額が一致しています";
  } else {
    const msgs = [];
    if(!qtyOk) msgs.push(`数量: 注文${log.quantity}個 → 納品${log.delivQty}個`);
    if(!amtOk) msgs.push(`金額: 注文¥${Number(log.amount).toLocaleString()} → 納品¥${Number(log.delivAmt).toLocaleString()}`);
    r.className="verify-banner verify-ng";
    r.innerHTML=`⚠️ 差異があります — ${msgs.join(" / ")}`;
  }
  r.style.display="flex";
}

/* ===== 送信 ===== */
$("#frm").addEventListener("submit", e=>{
  e.preventDefault();
  const btn=$("#btnSave"); btn.disabled=true; btn.textContent="保存中…";
  try{
    if(fMode==="supply"){
      const dqty = $("#iDelivQty").value ? Number($("#iDelivQty").value) : null;
      const damt = $("#iDelivAmt").value ? Number($("#iDelivAmt").value) : null;
      saveLog(editId||newId(),{
        logType:"supply",
        supplier: document.querySelector('input[name=supplier]:checked')?.value||"",
        dept:     document.querySelector('input[name=deptS]:checked')?.value||"",
        sName:    $("#iSName").value.trim(),
        quantity: $("#iQty").value ? Number($("#iQty").value) : null,
        amount:   $("#iAmt").value ? Number($("#iAmt").value) : null,
        date:     $("#iSDate").value||today(),
        orderNo:  $("#iOrderNo").value.trim()||null,
        sMemo:    $("#iSMemo").value.trim(),
        delivQty: dqty,
        delivAmt: damt,
        deliveryDate: $("#iDelivDate").value||null,
        status:   document.querySelector('input[name=supplyStatus]:checked')?.value||"発注済",
        createdAt:(editId?logs.find(l=>l.id===editId)?.createdAt:null)||Date.now(),
        updatedAt:Date.now()
      });
    } else {
      saveLog(editId||newId(),{
        logType:"device",
        category:document.querySelector('input[name=cat]:checked')?.value||"",
        action:  document.querySelector('input[name=act]:checked')?.value||"",
        dept:    document.querySelector('input[name=dept]:checked')?.value||"",
        name:    $("#iName").value.trim(),
        number:  $("#iNo").value.trim(),
        model:   $("#iModel").value.trim(),
        date:    $("#iDate").value||today(),
        status:  document.querySelector('input[name=status]:checked')?.value||"完了",
        memo:    $("#iMemo").value.trim(),
        createdAt:(editId?logs.find(l=>l.id===editId)?.createdAt:null)||Date.now(),
        updatedAt:Date.now()
      });
    }
    $("#dlg").close();
  }finally{ btn.disabled=false; btn.textContent="保存する"; }
});

/* ===== 編集・削除 ===== */
$("#list").addEventListener("click", e=>{
  const row=e.target.closest(".row"); if(!row) return;
  const l=logs.find(x=>x.id===row.dataset.id); if(!l) return;
  openForm(l);
});
$("#btnDel").onclick=()=>{
  if(!editId||!confirm("この記録を削除しますか？")) return;
  removeLog(editId);
  $("#dlg").close();
};

/* ===== ダイアログ制御 ===== */
$("#btnNew").onclick  = ()=>openForm({logType:mode==="supply"?"supply":"device"});
$("#fab").onclick     = ()=>openForm({logType:mode==="supply"?"supply":"device"});
$("#btnDlgX").onclick = ()=>$("#dlg").close();
$("#btnCancel").onclick = ()=>$("#dlg").close();
document.querySelectorAll("#frmTabs button").forEach(b=>b.onclick=()=>setFMode(b.dataset.fm));
document.querySelectorAll("#mainTabs button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;render();});

/* ===== OCR エンジン ===== */
let ocrWorker = null;
const ocrBlobs = {order:null, deliv:null};  // ファイル名生成用のみ、画像本体は保持しない

async function getOcrWorker(){
  if(ocrWorker) return ocrWorker;
  ocrWorker = await Tesseract.createWorker(["jpn","eng"],1,{
    logger: m=>{
      if(m.status==="recognizing text"){
        const pct = Math.round((m.progress||0)*100);
        const el = document.getElementById(m._zone==="deliv"?"ocrDelivStatus":"ocrOrderStatus");
        if(el) el.textContent=`読み取り中… ${pct}%`;
      }
    }
  });
  return ocrWorker;
}

async function fileToCanvas(file){
  if(file.type==="application/pdf"){
    const ab = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:ab}).promise;
    const page = await pdf.getPage(1);
    const vp = page.getViewport({scale:2});
    const canvas = document.createElement("canvas");
    canvas.width=vp.width; canvas.height=vp.height;
    await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
    return canvas;
  } else {
    return new Promise((res,rej)=>{
      const img=new Image(); const url=URL.createObjectURL(file);
      img.onload=()=>{ const c=document.createElement("canvas"); c.width=img.width; c.height=img.height; c.getContext("2d").drawImage(img,0,0); URL.revokeObjectURL(url); res(c); };
      img.onerror=rej; img.src=url;
    });
  }
}

function parseText(text){
  const r={};
  // 仕入先
  const sv = supplierFromText(text);
  if(sv) r.supplier=sv;
  // 金額
  const ams=[...text.matchAll(/[¥￥]?\s?(\d{1,3}(?:,\d{3})+|\d{3,})\s?円?/g)];
  if(ams.length){
    const ns=ams.map(m=>parseInt(m[1].replace(/,/g,""),10)).filter(n=>n>100&&n<10000000);
    if(ns.length) r.amount=Math.max(...ns);
  }
  // 数量
  const qm=text.match(/(\d+)\s*(?:個|枚|本|冊|箱|セット)/);
  if(qm) r.quantity=parseInt(qm[1],10);
  // 日付
  const dm=text.match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
  if(dm) r.date=`${dm[1]}-${dm[2].padStart(2,"0")}-${dm[3].padStart(2,"0")}`;
  // 注文番号
  const om=text.match(/(?:注文番号|注文No\.?|Order\s*No\.?|Order#|発注番号)[\s:：]?\s?([A-Z0-9\-]{5,20})/i);
  if(om) r.orderNo=om[1];
  // 品名候補
  const lines=text.split(/\n/).map(l=>l.trim()).filter(l=>l.length>4&&l.length<60&&!/^\d+$/.test(l)&&!/合計|送料|税|消費税|注文|領収|請求|TOTAL/i.test(l));
  if(lines.length) r.sName=lines.sort((a,b)=>b.length-a.length)[0];
  return r;
}

function makeFileName(parsed, origName){
  const code = supplierToCode(parsed.supplier||"");
  const date  = (parsed.date||today()).replace(/-/g,"");
  const amt   = parsed.amount ? String(parsed.amount) : "0";
  const ext   = (origName||"").match(/\.pdf$/i) ? ".pdf" : ".jpg";
  return `${code}-${date}-${amt}${ext}`;
}

function resetOcrZone(zone){
  const Z=zone==="order";
  const pre=Z?"ocrOrderPreview":"ocrDelivPreview";
  const res=Z?"ocrOrderResult":"ocrDelivResult";
  const st=Z?"ocrOrderStatus":"ocrDelivStatus";
  $("#"+pre).style.display="none";
  $("#"+res).style.display="none";
  const sel=document.getElementById(st); if(sel) sel.textContent="";
  ocrBlobs[zone]=null;
}

async function runOcr(file, zone){
  const isOrder = zone==="order";
  const statusId = isOrder?"ocrOrderStatus":"ocrDelivStatus";
  const previewId = isOrder?"ocrOrderPreview":"ocrDelivPreview";
  const imgId     = isOrder?"ocrOrderImg":"ocrDelivImg";
  const resultId  = isOrder?"ocrOrderResult":"ocrDelivResult";
  const resultTxtId=isOrder?"ocrOrderResultText":"ocrDelivResultText";
  const dlBtnId   = isOrder?"btnDlOrder":"btnDlDeliv";

  document.getElementById(statusId).textContent="準備中…";
  $("#"+resultId).style.display="none";

  try{
    // canvasに描画してプレビュー表示（元ファイルの中身をBase64などで保存しない）
    const canvas = await fileToCanvas(file);
    const previewUrl = canvas.toDataURL("image/jpeg", 0.7);
    document.getElementById(imgId).src = previewUrl;
    $("#"+previewId).style.display="";

    // OCR実行
    document.getElementById(statusId).textContent="読み取り中…";
    const worker = await getOcrWorker();
    const {data} = await worker.recognize(canvas);
    const text = data.text||"";

    addCommLog("OCR完了", "Tesseract.js（ローカル処理）",
      `${zone==="order"?"注文書":"納品書"} — ${text.length}文字読み取り / 外部送信なし`);
    document.getElementById(statusId).textContent="✓ 完了";

    const parsed = parseText(text);

    if(isOrder){
      // フォームに自動入力
      if(parsed.supplier) document.querySelectorAll('input[name=supplier]').forEach(r=>r.checked=r.value===parsed.supplier);
      if(parsed.amount)   $("#iAmt").value=parsed.amount;
      if(parsed.quantity) $("#iQty").value=parsed.quantity;
      if(parsed.date)     $("#iSDate").value=parsed.date;
      if(parsed.orderNo)  $("#iOrderNo").value=parsed.orderNo;
      if(parsed.sName&&!$("#iSName").value) $("#iSName").value=parsed.sName;

      // 結果表示
      const lines=[
        parsed.supplier?`購入先: ${parsed.supplier}`:null,
        parsed.date    ?`日付: ${parsed.date}`:null,
        parsed.amount  ?`金額: ¥${Number(parsed.amount).toLocaleString()}`:null,
        parsed.quantity?`数量: ${parsed.quantity}個`:null,
        parsed.orderNo ?`注文番号: ${parsed.orderNo}`:null,
      ].filter(Boolean);
      document.getElementById(resultTxtId).textContent = lines.join(" | ") || "情報を読み取れませんでした";
      $("#"+resultId).style.display="";

      // ファイル名生成 → ダウンロードボタン（元ファイルはこのblobのみ保持）
      ocrBlobs.order = file;
      const fname = makeFileName(parsed, file.name);
      const dlBtn = $("#"+dlBtnId);
      dlBtn.textContent = `📥 ${fname} でダウンロード（BOX保存用）`;
      dlBtn.style.display="";
      dlBtn.onclick=()=>{
        const url=URL.createObjectURL(ocrBlobs.order);
        const a=document.createElement("a"); a.href=url; a.download=fname; a.click();
        URL.revokeObjectURL(url);
        addCommLog("電帳法DL", "ローカル", `${fname} をダウンロード`);
      };

    } else {
      // 納品書 → 照合
      const dqty = parsed.quantity || null;
      const damt = parsed.amount   || null;
      if(dqty) $("#iDelivQty").value = dqty;
      if(damt) $("#iDelivAmt").value = damt;
      if(parsed.date) $("#iDelivDate").value = parsed.date;

      // 注文値と照合
      const oqty = $("#iQty").value ? Number($("#iQty").value) : null;
      const oamt = $("#iAmt").value ? Number($("#iAmt").value) : null;
      const qtyOk = oqty==null || dqty==null || oqty===dqty;
      const amtOk = oamt==null || damt==null || oamt===damt;

      let verifyHtml="";
      if(qtyOk&&amtOk){
        verifyHtml=`<div class="verify-banner verify-ok">✓ 注文と一致しています！数量・金額OK</div>`;
        // 状態を「受取済」に自動切替
        document.querySelectorAll('input[name=supplyStatus]').forEach(r=>r.checked=r.value==="受取済");
      } else {
        const msgs=[];
        if(!qtyOk) msgs.push(`数量: 注文${oqty}個 → 納品${dqty}個`);
        if(!amtOk) msgs.push(`金額: 注文¥${Number(oamt).toLocaleString()} → 納品¥${Number(damt).toLocaleString()}`);
        verifyHtml=`<div class="verify-banner verify-ng">⚠️ 差異あり — ${msgs.join(" / ")}</div>`;
        document.querySelectorAll('input[name=supplyStatus]').forEach(r=>r.checked=r.value==="差異あり");
      }
      const lines=[
        damt  ?`金額: ¥${Number(damt).toLocaleString()}`:null,
        dqty  ?`数量: ${dqty}個`:null,
        parsed.date?`日付: ${parsed.date}`:null,
      ].filter(Boolean);
      document.getElementById(resultTxtId).innerHTML = verifyHtml + lines.join(" | ");
      $("#"+resultId).style.display="";
      $("#verifyResult").style.display="none"; // OCR後はresultに統合

      // 納品書DLボタン
      ocrBlobs.deliv = file;
      const fnameParsed = {supplier:document.querySelector('input[name=supplier]:checked')?.value, date:parsed.date, amount:damt};
      const fname = makeFileName(fnameParsed, file.name).replace(/\./, "-納品書.");
      const dlBtn = $("#"+dlBtnId);
      dlBtn.textContent = `📥 ${fname} でダウンロード（BOX保存用）`;
      dlBtn.style.display="";
      dlBtn.onclick=()=>{
        const url=URL.createObjectURL(ocrBlobs.deliv);
        const a=document.createElement("a"); a.href=url; a.download=fname; a.click();
        URL.revokeObjectURL(url);
        addCommLog("電帳法DL", "ローカル", `${fname} をダウンロード`);
      };
    }

    // canvasのデータをクリア（プレビュー表示用のdata:URLはimgに入っているが、元ファイルはblobのみ）
    canvas.width=0; canvas.height=0;

  }catch(err){
    document.getElementById(statusId).textContent="エラー";
    addCommLog("OCR失敗", "Tesseract.js", err.message, false);
    alert("読み取りに失敗しました: "+err.message);
  }
}

// OCRファイル選択イベント（委譲）
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="ocrOrderCamera"||t.id==="ocrOrderFile"){
    const f=t.files?.[0]; if(f) runOcr(f,"order"); t.value="";
  }
  if(t.id==="ocrDelivCamera"||t.id==="ocrDelivFile"){
    const f=t.files?.[0]; if(f) runOcr(f,"deliv"); t.value="";
  }
});
// クリアボタン（委譲）
document.addEventListener("click", e=>{
  const btn=e.target.closest("[data-zone]"); if(!btn||!btn.classList.contains("ocr-clear")) return;
  resetOcrZone(btn.dataset.zone);
});

/* ===== Excel エクスポート ===== */
$("#btnExcel").onclick=()=>{
  if(!logs.length){ alert("データがありません"); return; }
  const deviceRows=logs.filter(l=>l.logType!=="supply");
  const supplyRows=logs.filter(l=>l.logType==="supply");
  const wb=XLSX.utils.book_new();

  const wsD=XLSX.utils.aoa_to_sheet([
    ["日付","種別","手続き","部署","担当者","電話番号","機種","状態","メモ"],
    ...deviceRows.map(r=>[r.date||"",r.category||"",r.action||"",r.dept||"",r.name||"",r.number||"",r.model||"",r.status||"",r.memo||""])
  ]);
  wsD["!cols"]=[10,10,10,10,12,14,16,8,20].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,wsD,"端末・ライセンス");

  const wsS=XLSX.utils.aoa_to_sheet([
    ["注文日","品名","購入先","部署","注文数量","注文金額","注文番号","納品日","納品数量","納品金額","状態","メモ"],
    ...supplyRows.map(r=>[r.date||"",r.sName||"",r.supplier||"",r.dept||"",r.quantity??"",r.amount??"",r.orderNo||"",r.deliveryDate||"",r.delivQty??"",r.delivAmt??"",r.status||"",r.sMemo||""])
  ]);
  wsS["!cols"]=[10,20,12,10,8,10,14,10,8,10,8,20].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,wsS,"備品・消耗品");

  const stamp=new Date().toISOString().slice(0,10).replace(/-/g,"");
  XLSX.writeFile(wb,`手続き備品ログ_${stamp}.xlsx`);
  addCommLog("Excel出力","ローカル",`端末${deviceRows.length}件・備品${supplyRows.length}件`);
};

/* ===== 通信ログ ===== */
const commLog=[];
function addCommLog(type,dest,detail,ok=true){
  const now=new Date();
  const ts=now.toLocaleDateString("ja-JP",{month:"2-digit",day:"2-digit"})+" "+now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const ua=navigator.userAgent;
  const dev=ua.includes("iPhone")||ua.includes("Android")||ua.includes("iPad")?"📱":"💻";
  commLog.unshift({ts,type,dest,detail,ok,dev});
  if(commLog.length>100) commLog.length=100;
}

function showCommLog(){
  const html=commLog.length===0
    ?'<p style="color:var(--muted);font-size:12px;padding:8px 0">まだ操作ログはありません</p>'
    :commLog.map(c=>`
      <div style="display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px">
        <span style="color:var(--muted);white-space:nowrap">${c.ts} ${c.dev}</span>
        <span>
          <span style="font-weight:700;color:${c.ok?"var(--accent)":"var(--c-cancel)"}">${c.ok?"✓":"✗"} ${esc(c.type)}</span>
          <span style="color:var(--muted)"> → ${esc(c.dest)}</span><br>
          <span style="color:var(--ink2)">${esc(c.detail)}</span>
        </span>
      </div>`).join("");
  const box=document.createElement("div");
  box.style.cssText="position:fixed;inset:0;background:rgb(0 0 0/.5);z-index:300;display:flex;align-items:center;justify-content:center";
  box.innerHTML=`<div style="background:var(--surface);border-radius:14px;padding:0;width:min(96vw,560px);max-height:80dvh;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)">
      <h3 style="font-size:14px;font-weight:700">🔒 操作・通信ログ</h3>
      <button style="border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--muted)" id="logClose">✕</button>
    </div>
    <div style="padding:4px 20px 16px;overflow-y:auto">
      <p style="font-size:11px;color:var(--muted);padding:8px 0 4px">このツールのすべての操作・通信を記録しています。<br>OCR処理はブラウザ内のみで完結し、画像データは外部に送信されません。</p>
      ${html}
    </div>
  </div>`;
  document.body.appendChild(box);
  box.addEventListener("click",e=>{ if(e.target===box||e.target.id==="logClose") box.remove(); });
}
$("#btnLog").onclick=()=>showCommLog();

/* ===== QR ===== */

$("#btnQr").onclick=()=>{

    new QRCode($("#qrcode"),{text:location.href,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});

};
$("#qrClose").onclick=()=>$("#qrOverlay").classList.remove("open");
