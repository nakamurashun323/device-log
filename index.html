<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手続き・備品ログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --surface: #ffffff;
  --bg: #f7f9fc;
  --border: #e3e8f0;
  --border-strong: #c9d3e1;
  --text: #142033;
  --text-muted: #66758c;
  --accent: #2563a8;
  --accent-hover: #1e4f88;
  --accent-light: #eaf2fc;
  --accent-mid: #cfe0f5;
  --danger: #c4323a;
  --danger-light: #fdf0f1;
  --hover: #f2f6fb;
  --r: 8px;
  --f: "Inter","Noto Sans JP",system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface: #1a2232; --bg: #121926; --border: #2a3549; --border-strong: #3a4862;
  --text: #e3e9f2; --text-muted: #8c9ab0;
  --accent: #6aa5ea; --accent-hover: #8bbaf0; --accent-light: #1d2c44; --accent-mid: #27406a;
  --danger: #f07178; --danger-light: #3a1d22; --hover: #1f2939;
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --surface: #1a2232; --bg: #121926; --border: #2a3549; --border-strong: #3a4862;
  --text: #e3e9f2; --text-muted: #8c9ab0;
  --accent: #6aa5ea; --accent-hover: #8bbaf0; --accent-light: #1d2c44; --accent-mid: #27406a;
  --danger: #f07178; --danger-light: #3a1d22; --hover: #1f2939;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--f); font-size: 14px; line-height: 1.6; min-height: 100dvh; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 96px; }

.hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.hdr-title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.hdr-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 13px; border-radius: var(--r); font-size: 13px; font-weight: 500; transition: background .12s, color .12s, border-color .12s; white-space: nowrap; }
.btn-ghost { border: 1px solid var(--border); color: var(--text-muted); background: var(--surface); }
.btn-ghost:hover { border-color: var(--border-strong); color: var(--text); }
.btn-primary { background: var(--accent); color: #fff; border: 1px solid transparent; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-outline { border: 1px solid var(--accent); color: var(--accent); background: var(--surface); }
.btn-outline:hover { background: var(--accent-light); }
.btn-danger { color: var(--danger); border: 1px solid var(--border); background: var(--surface); }
.btn-danger:hover { border-color: var(--danger); background: var(--danger-light); }

.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.tab-btn { padding: 10px 16px; font-size: 13px; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab-btn[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn:hover:not([aria-pressed="true"]) { color: var(--text); }
.tab-count { font-size: 11px; margin-left: 6px; color: var(--text-muted); }
.tab-btn[aria-pressed="true"] .tab-count { color: var(--accent); }

.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.quick[hidden] { display: none; }
.quick .btn { padding: 10px; }

.list-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.empty-state { padding: 56px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }
.list-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
.list-row:last-child { border-bottom: none; }
.list-row:hover { background: var(--hover); }
.row-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.row-label { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 4px; background: var(--accent-light); color: var(--accent); white-space: nowrap; }
.row-label.is-cancel { background: var(--danger-light); color: var(--danger); }
.row-title { font-size: 13.5px; font-weight: 500; }
.row-dept { font-size: 12px; color: var(--text-muted); }
.row-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.row-right { text-align: right; }
.row-date { font-size: 12px; color: var(--text-muted); }
.row-status { font-size: 11px; margin-top: 2px; color: var(--text-muted); }
.row-status.done { color: var(--accent); }
.row-status.diff, .diff-mark { color: var(--danger); }
.diff-mark { font-size: 11px; }

dialog { border: none; border-radius: 12px; padding: 0; background: var(--surface); color: var(--text); box-shadow: 0 4px 32px rgb(0 0 0 / .16); width: min(96vw, 520px); max-height: 92dvh; overflow: hidden; }
dialog[open] { display: grid; grid-template-rows: auto auto 1fr; }
dialog::backdrop { background: rgb(0 0 0 / .4); }
.dlg-head { padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dlg-head h2 { font-size: 15px; font-weight: 600; }
.icon-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--text-muted); font-size: 15px; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.dlg-tabs { display: flex; border-bottom: 1px solid var(--border); margin: 12px 20px 0; }
.dlg-tab { padding: 8px 14px; font-size: 12px; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.dlg-tab[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
form { overflow-y: auto; padding: 16px 20px 20px; display: grid; gap: 14px; }
#secDevice, #secSupply { display: grid; gap: 14px; }
#secDevice[hidden], #secSupply[hidden] { display: none; }
.field { display: grid; gap: 5px; }
.field > label, .field-label { font-size: 12px; color: var(--text-muted); }
.field input, .field textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r);
  background: var(--bg); font-size: 14px; transition: border-color .12s;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); outline: none; }
.field textarea { resize: vertical; min-height: 54px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; width: 0; height: 0; }
.chip span {
  display: inline-block; padding: 5px 11px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 12.5px; cursor: pointer; color: var(--text-muted); background: var(--surface);
  transition: all .1s; white-space: nowrap; user-select: none;
}
.chip span:hover { border-color: var(--border-strong); color: var(--text); }
.chip:has(input:checked) span { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }

.form-actions { display: flex; gap: 8px; justify-content: flex-end; padding-top: 2px; }
.form-actions .left { margin-right: auto; }

/* OCR */
.ocr-zone { border: 1px solid var(--border); border-radius: var(--r); padding: 12px; background: var(--bg); display: grid; gap: 10px; }
.ocr-zone.is-verify { border-color: var(--accent-mid); background: var(--accent-light); }
.ocr-zone-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; }
.ocr-zone-head .t { color: var(--text); font-weight: 500; }
.ocr-zone-head .s { color: var(--accent); font-size: 11px; }
.ocr-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ocr-pick { display: flex; align-items: center; justify-content: center; padding: 9px; border: 1px solid var(--accent); border-radius: var(--r); cursor: pointer; font-size: 12.5px; color: var(--accent); background: var(--surface); }
.ocr-pick:hover { background: var(--accent-light); }
.ocr-preview { position: relative; }
.ocr-preview img { width: 100%; max-height: 140px; object-fit: contain; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); }
.ocr-clear { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgb(0 0 0 / .5); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.ocr-result { padding: 9px 10px; border: 1px solid var(--accent-mid); border-radius: var(--r); background: var(--surface); font-size: 12px; display: grid; gap: 6px; }
.ocr-result-text { color: var(--text-muted); line-height: 1.7; }
.ocr-dl { width: 100%; padding: 9px; border-radius: var(--r); background: var(--accent); color: #fff; font-size: 12.5px; }
.ocr-dl:hover { background: var(--accent-hover); }
.bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
[hidden] { display: none !important; }

.verify-banner { padding: 8px 10px; border-radius: 6px; font-size: 12.5px; }
.verify-ok { background: var(--surface); color: var(--accent); border: 1px solid var(--accent-mid); }
.verify-ng { background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger); }

/* オーバーレイ共通 */
.modal-overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .4); z-index: 300; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-overlay.open { display: flex; }
.modal-box { background: var(--surface); border-radius: 12px; width: min(100%, 520px); max-height: 82dvh; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 14px; font-weight: 600; }
.modal-body { overflow-y: auto; padding: 14px 18px 18px; }
.note { font-size: 12px; color: var(--text-muted); line-height: 1.7; }

/* QR */
.seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; padding: 7px 8px; font-size: 12px; color: var(--text-muted); border-right: 1px solid var(--border); }
.seg button:last-child { border-right: none; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.qr-wrap { display: grid; justify-items: center; gap: 10px; padding-top: 16px; text-align: center; }
#qrcode { padding: 12px; background: #fff; border-radius: 8px; border: 1px solid var(--border); }
.qr-url { font-size: 10.5px; color: var(--text-muted); word-break: break-all; }

/* 撮影画面 */
.scan-screen { position: fixed; inset: 0; z-index: 400; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 24px 20px; }
.scan-screen.open { display: flex; }
.scan-inner { width: 100%; max-width: 360px; display: grid; gap: 12px; text-align: center; }
.scan-kicker { font-size: 12px; color: var(--accent); letter-spacing: .04em; }
.scan-inner h2 { font-size: 20px; font-weight: 600; }
.scan-inner p { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.scan-shoot { display: block; padding: 16px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; }
.scan-shoot:active { background: var(--accent-hover); }
.scan-shoot:disabled { opacity: .45; cursor: default; }
.scan-screen { overflow-y: auto; align-items: flex-start; }
.scan-inner { margin: auto 0; }
.cam { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 52dvh; border-radius: 10px; overflow: hidden; background: #0b1220; }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; color: #c9d6ea; font-size: 12.5px; line-height: 1.7; text-align: center; }
.cam-msg { white-space: pre-line; }
.cam-msg[hidden] { display: none; }
.scan-alt { display: block; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; cursor: pointer; }
.scan-cancel { font-size: 13px; color: var(--text-muted); padding: 8px; }

/* 認識中 */
.busy { position: fixed; inset: 0; z-index: 500; background: rgb(0 0 0 / .45); display: none; align-items: center; justify-content: center; }
.busy.open { display: flex; }
.busy-box { background: var(--surface); border-radius: 12px; padding: 24px 22px; width: min(86vw, 320px); display: grid; gap: 12px; text-align: center; }
.busy-title { font-size: 15px; font-weight: 500; }
.busy-sub { font-size: 11px; color: var(--text-muted); }

/* 候補選択 */
.pick-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; width: 100%; text-align: left; padding: 11px 12px; border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 8px; background: var(--surface); }
.pick-row:hover { border-color: var(--accent); background: var(--accent-light); }
.pick-row .t { font-size: 13px; font-weight: 500; }
.pick-row .s { font-size: 12px; color: var(--text-muted); }
.pick-new { width: 100%; padding: 10px; font-size: 12.5px; color: var(--text-muted); border: 1px dashed var(--border-strong); border-radius: var(--r); }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #142033; color: #fff; padding: 9px 18px; border-radius: 8px; font-size: 13px; z-index: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

.new-btn-wrap { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 16px; z-index: 100; }
.new-btn-wrap .btn { padding: 10px 18px; border-radius: 22px; box-shadow: 0 2px 10px rgb(0 0 0 / .16); }
@media(min-width:600px) { .new-btn-wrap { display: none; } }

@media(max-width:600px){
  .hdr-actions #btnNew { display: none; }
  dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0; }
  .dlg-head { padding: 14px 16px 0; }
  .dlg-tabs { margin: 10px 16px 0; }
  form { padding: 14px 16px 0; }
  .field input { font-size: 16px; }
  .form-actions { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); margin: 0 -16px; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hdr">
    <span class="hdr-title">手続き・備品ログ</span>
    <div class="hdr-actions">
      <button class="btn btn-ghost" id="btnLog" type="button">通信ログ</button>
      <button class="btn btn-ghost" id="btnQr" type="button">QR</button>
      <button class="btn btn-ghost" id="btnExcel" type="button">Excel</button>
      <button class="btn btn-primary" id="btnNew" type="button">新規</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn" data-m="device" aria-pressed="true" type="button">端末・ライセンス<span class="tab-count" id="cntD">0</span></button>
    <button class="tab-btn" data-m="supply" aria-pressed="false" type="button">備品・消耗品<span class="tab-count" id="cntS">0</span></button>
  </div>

  <div class="quick" id="quickBar" hidden>
    <button class="btn btn-outline" type="button" data-scan="order">注文書を撮影</button>
    <button class="btn btn-outline" type="button" data-scan="deliv">納品書を照合</button>
  </div>

  <div class="list-card" id="list"></div>
</div>

<div class="new-btn-wrap"><button class="btn btn-primary" id="fabNew" type="button">新規</button></div>
<div class="toast" id="toast" role="status"></div>

<!-- 撮影画面（QRから直接開く） -->
<div class="scan-screen" id="scanScreen" role="dialog" aria-modal="true" aria-labelledby="scanTitle">
  <div class="scan-inner">
    <div class="scan-kicker" id="scanKicker">発注</div>
    <h2 id="scanTitle">注文書を撮影</h2>
    <p id="scanDesc">書類全体が入るように撮影してください。読み取った内容が自動で入力されます。</p>
    <div class="cam" id="camBox">
      <video id="camVideo" playsinline muted autoplay></video>
      <div class="cam-msg" id="camMsg">カメラを起動しています…</div>
    </div>
    <button class="scan-shoot" id="camShoot" type="button" disabled>撮影する</button>
    <label class="scan-alt" id="pickPhoto">撮った写真を選ぶ<input type="file" id="scanFile" accept="image/*,application/pdf" hidden></label>
    <p class="note" id="camFallbackNote" hidden>このiPhoneではブラウザからカメラが使えないため、カメラアプリで撮った写真を選んでください。選ぶと自動で読み取ります。</p>
    <label class="scan-alt" id="pickCamera">標準カメラで撮影<input type="file" id="scanCamera" accept="image/*" capture="environment" hidden></label>
    <button class="scan-cancel" id="scanCancel" type="button">一覧へ戻る</button>
  </div>
</div>

<!-- 認識中 -->
<div class="busy" id="busy" role="status" aria-live="polite">
  <div class="busy-box">
    <div class="busy-title" id="busyTitle">認識しています…</div>
    <div class="bar"><div class="bar-fill" id="busyBar"></div></div>
    <div class="busy-sub" id="busySub">端末内で処理しています（外部送信なし）</div>
  </div>
</div>

<!-- 発注の候補選択 -->
<div class="modal-overlay" id="pickOverlay">
  <div class="modal-box">
    <div class="modal-head"><h3>どの発注の納品ですか</h3><button class="icon-btn" id="pickClose" type="button" aria-label="閉じる">✕</button></div>
    <div class="modal-body">
      <p class="note" id="pickInfo" style="margin-bottom:12px"></p>
      <div id="pickList"></div>
      <button class="pick-new" id="pickNew" type="button">該当なし（新しい記録として登録）</button>
    </div>
  </div>
</div>

<!-- 通信ログ -->
<div class="modal-overlay" id="logOverlay">
  <div class="modal-box">
    <div class="modal-head"><h3>通信ログ</h3><button class="icon-btn" id="logClose" type="button" aria-label="閉じる">✕</button></div>
    <div class="modal-body">
      <p class="note" style="margin-bottom:10px">記録はこの端末のブラウザ内にのみ保存されます。OCRは端末内で処理し、画像は外部に送信も保存もしません。</p>
      <div id="logList"></div>
    </div>
  </div>
</div>

<!-- QR -->
<div class="modal-overlay" id="qrOverlay">
  <div class="modal-box" style="max-width:360px">
    <div class="modal-head"><h3>QRコード</h3><button class="icon-btn" id="qrClose" type="button" aria-label="閉じる">✕</button></div>
    <div class="modal-body">
      <div class="seg" id="qrSeg">
        <button type="button" data-q="order">発注用</button>
        <button type="button" data-q="deliv">納品用</button>
        <button type="button" data-q="top">一覧</button>
      </div>
      <div class="qr-wrap">
        <div id="qrcode"></div>
        <p class="note" id="qrDesc"></p>
        <p class="qr-url" id="qrUrl"></p>
        <button class="btn btn-ghost" id="qrSave" type="button">画像を保存</button>
      </div>
    </div>
  </div>
</div>

<!-- フォーム -->
<dialog id="dlg">
  <div class="dlg-head">
    <h2 id="dlgTitle">新規記録</h2>
    <button class="icon-btn" id="btnDlgX" type="button" aria-label="閉じる">✕</button>
  </div>
  <div class="dlg-tabs">
    <button class="dlg-tab" data-fm="device" aria-pressed="true" type="button">端末</button>
    <button class="dlg-tab" data-fm="supply" aria-pressed="false" type="button">備品</button>
  </div>

  <form id="frm" method="dialog">

    <div id="secDevice">
      <div class="field"><span class="field-label">種別</span>
        <div class="chip-group">
          <label class="chip"><input type="radio" name="cat" value="携帯"><span>携帯</span></label>
          <label class="chip"><input type="radio" name="cat" value="ポケットWi-Fi"><span>Wi-Fi</span></label>
          <label class="chip"><input type="radio" name="cat" value="PC"><span>PC</span></label>
          <label class="chip"><input type="radio" name="cat" value="Microsoft 365"><span>M365</span></label>
        </div>
      </div>
      <div class="field"><span class="field-label">手続き</span>
        <div class="chip-group">
          <label class="chip"><input type="radio" name="act" value="発注"><span>発注</span></label>
          <label class="chip"><input type="radio" name="act" value="機種変更"><span>機種変更</span></label>

<script>
/* ===== 定数 ===== */
const LS_LOGS = "devlog.logs";
const DEPTS = ["本社","MB","KB","FB","BS","SB","CP","OS","HB","KM","EB","SE","YB","KE","DM","推進室"];
const SUPPLIER_MAP = [
  { code:"ASKL", label:"ASKUL",          keys:["askul","アスクル"] },
  { code:"AMZN", label:"Amazon",         keys:["amazon","アマゾン"] },
  { code:"FRST", label:"フォレストウェイ", keys:["フォレストウェイ","forestway"] },
];

/* ===== ユーティリティ ===== */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const newId = () => "L" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmtDate = d => d ? d.slice(5).replace('-','/') : "";
const yen = n => "¥" + Number(n).toLocaleString();
const num = v => v===""||v==null ? null : Number(v);
const radioVal = name => document.querySelector(`input[name=${name}]:checked`)?.value || "";
const setRadio = (name, v) => $$(`input[name=${name}]`).forEach(r => r.checked = r.value === v);

function supplierToCode(name){
  const n = (name||"").toLowerCase();
  for(const s of SUPPLIER_MAP) if(s.keys.some(k=>n.includes(k))) return s.code;
  return "OTHER";
}
function supplierFromText(text){
  const t = text.toLowerCase().replace(/\s/g,"");
  for(const s of SUPPLIER_MAP) if(s.keys.some(k=>t.includes(k))) return s.label;
  return null;
}

let toastTimer;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ===== データ ===== */
let logs = [], mode = "device", fMode = "device", editId = null;
function lsLoad(){ try{ const l=localStorage.getItem(LS_LOGS); if(l) logs=JSON.parse(l)||[]; }catch(e){} }
function lsSave(){ try{ localStorage.setItem(LS_LOGS, JSON.stringify(logs)); }catch(e){ alert("この端末に保存できませんでした（プライベートブラウズでは保存されません）"); } }
function saveLog(id, data){
  const row = {id,...data};
  const idx = logs.findIndex(l=>l.id===id);
  if(idx>=0) logs[idx]=row; else logs.unshift(row);
  lsSave(); render(); addLog("保存","この端末（localStorage）",`ID:${id}`);
}
function removeLog(id){
  logs = logs.filter(l=>l.id!==id);
  lsSave(); render(); addLog("削除","この端末（localStorage）",`ID:${id}`);
}

/* ===== 一覧 ===== */
function buildChips(){
  [["segDept","dept"],["segDeptS","deptS"]].forEach(([id,name])=>{
    $("#"+id).innerHTML = DEPTS.map(d=>`<label class="chip"><input type="radio" name="${name}" value="${esc(d)}"><span>${esc(d)}</span></label>`).join("");
  });
}
const statusCls = s => s==="完了"||s==="受取済" ? "done" : s==="差異あり" ? "diff" : "";
const hasDiff = l => (l.delivQty!=null&&l.quantity!=null&&Number(l.delivQty)!==Number(l.quantity)) ||
                     (l.delivAmt!=null&&l.amount!=null&&Number(l.delivAmt)!==Number(l.amount));

function render(){
  const dLogs = logs.filter(l=>l.logType!=="supply");
  const sLogs = logs.filter(l=>l.logType==="supply");
  $("#cntD").textContent = dLogs.length;
  $("#cntS").textContent = sLogs.length;
  $$(".tab-btn").forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===mode));
  $("#quickBar").hidden = mode!=="supply";
  const cur = mode==="supply" ? sLogs : dLogs;
  if(!cur.length){ $("#list").innerHTML = '<div class="empty-state">まだ記録がありません</div>'; return; }
  $("#list").innerHTML = cur.map(l=>{
    if(l.logType==="supply"){
      const parts = [l.supplier, l.quantity!=null?`${l.quantity}個`:null, l.amount!=null?yen(l.amount):null].filter(Boolean);
      return `<div class="list-row" data-id="${esc(l.id)}">
        <div>
          <div class="row-top">
            <span class="row-label">購入</span>
            <span class="row-title">${esc(l.sName||l.supplier||"（品名未入力）")}</span>
            ${l.dept?`<span class="row-dept">${esc(l.dept)}</span>`:""}
            ${hasDiff(l)?`<span class="diff-mark">差異あり</span>`:""}
          </div>
          ${parts.length?`<div class="row-sub">${esc(parts.join(" · "))}</div>`:""}
        </div>
        <div class="row-right"><div class="row-date">${fmtDate(l.date)}</div><div class="row-status ${statusCls(l.status)}">${esc(l.status||"")}</div></div>
      </div>`;
    }
    const sub = [l.category, l.model, l.number].filter(Boolean).join(" · ");
    return `<div class="list-row" data-id="${esc(l.id)}">
      <div>
        <div class="row-top">
          <span class="row-label${l.action==="解約"?" is-cancel":""}">${esc(l.action||"—")}</span>
          <span class="row-title">${esc(l.name||"（氏名未入力）")}</span>
          ${l.dept?`<span class="row-dept">${esc(l.dept)}</span>`:""}
        </div>
        ${sub?`<div class="row-sub">${esc(sub)}</div>`:""}
      </div>
      <div class="row-right"><div class="row-date">${fmtDate(l.date)}</div><div class="row-status ${statusCls(l.status)}">${esc(l.status||"")}</div></div>
    </div>`;
  }).join("");
}

/* ===== フォーム ===== */
function setFMode(m){
  fMode=m;

    $("#iSName").value=pre.sName||""; $("#iQty").value=pre.quantity??""; $("#iAmt").value=pre.amount??"";
    $("#iSDate").value=pre.date||today(); $("#iOrderNo").value=pre.orderNo||""; $("#iSMemo").value=pre.sMemo||"";
    $("#iDelivQty").value=pre.delivQty??""; $("#iDelivAmt").value=pre.delivAmt??""; $("#iDelivDate").value=pre.deliveryDate||"";
    $("#verifySection").hidden = !(editId || opts.verify);
    renderVerify();

  if(!$("#dlg").open) $("#dlg").showModal();

/* 注文と納品の数値を比べて表示・状態を更新 */
function renderVerify(autoStatus=false){
  const oq=num($("#iQty").value), oa=num($("#iAmt").value), dq=num($("#iDelivQty").value), da=num($("#iDelivAmt").value);
  const el=$("#verifyResult");
  if(dq==null && da==null){ el.innerHTML=""; return; }
  const ms=[];
  if(oq!=null && dq!=null && oq!==dq) ms.push(`数量 注文${oq} / 納品${dq}`);
  if(oa!=null && da!=null && oa!==da) ms.push(`金額 注文${yen(oa)} / 納品${yen(da)}`);
  el.innerHTML = ms.length
    ? `<div class="verify-banner verify-ng">差異があります — ${esc(ms.join("、"))}</div>`
    : `<div class="verify-banner verify-ok">注文内容と一致しています</div>`;
  if(autoStatus) setRadio("supplyStatus", ms.length ? "差異あり" : "受取済");
}
["iQty","iAmt","iDelivQty","iDelivAmt"].forEach(id=>$("#"+id).addEventListener("input",()=>renderVerify(true)));

$("#frm").addEventListener("submit", e=>{
  e.preventDefault();
  const prev = editId ? logs.find(l=>l.id===editId) : null;

$("#list").addEventListener("click", e=>{

$("#btnDel").onclick=()=>{ if(!editId||!confirm("この記録を削除しますか？")) return; removeLog(editId); $("#dlg").close(); };

$("#btnDlgX").onclick=()=>$("#dlg").close();
$("#btnCancel").onclick=()=>$("#dlg").close();

$$(".dlg-tab").forEach(b=>b.onclick=()=>setFMode(b.dataset.fm));
$$(".tab-btn").forEach(b=>b.onclick=()=>{ mode=b.dataset.m; render(); });

/* ===== OCR（PaddleOCR PP-OCRv5 をこの端末のブラウザ内で実行。画像は外部に送信しない） ===== */
const ocrFiles={order:null, deliv:null};   // 電帳法ファイル保存用にメモリ上だけで保持（保存はしない）
const OCR_BASE = new URL("./ocr/", location.href).href;
const OCR_FILES = [
  { key:"det",  name:"PP-OCRv5_mobile_det_infer.ort",  size:4896928 },
  { key:"rec",  name:"PP-OCRv5_mobile_rec_infer.onnx", size:16559278 },
  { key:"dict", name:"ppocrv5_dict.txt",               size:74014 },
  { key:"wasm", name:"ort-wasm-simd-threaded.wasm",    size:11905541 },
];
const OCR_CACHE = "ocr-models-v1";
let ocrService=null, ocrPromise=null, filesPromise=null, progressCb=null;

/* 読み取りモデルは初回だけこのサイトから取得し、端末に保存して2回目以降は再利用 */
async function fetchWithCache(f, onBytes){
  const url = OCR_BASE + f.name;
  let cache=null;
  try{
    cache = await caches.open(OCR_CACHE);
    const hit = await cache.match(url);
    if(hit){ const b=await hit.arrayBuffer(); onBytes(f.size); return b; }
  }catch(e){}
  const res = await fetch(url);
  if(!res.ok) throw new Error(`${f.name} を読み込めませんでした（${res.status}）`);
  const reader=res.body.getReader(), chunks=[]; let got=0;
  for(;;){ const {done,value}=await reader.read(); if(done) break; chunks.push(value); got+=value.length; onBytes(value.length); }
  const buf=new Uint8Array(got); let o=0; for(const c of chunks){ buf.set(c,o); o+=c.length; }
  try{ if(cache) await cache.put(url, new Response(buf.slice(0))); }catch(e){}
  return buf.buffer;
}
function loadOcrFiles(){
  if(!filesPromise){
    const total=OCR_FILES.reduce((s,f)=>s+f.size,0); let done=0;
    const tick=n=>{ done+=n; if(progressCb) progressCb({phase:"load", p:Math.min(1,done/total)}); };
    filesPromise = Promise.all(OCR_FILES.map(f=>fetchWithCache(f,tick).then(b=>[f.key,b])))
      .then(e=>{ addLog("読み取りモデル","このサイト（GitHub Pages）","取得完了・2回目以降は端末内の保存分を使用"); return Object.fromEntries(e); })
      .catch(e=>{ filesPromise=null; throw e; });
  }
  return filesPromise;
}
function getOcr(){
  if(ocrService) return Promise.resolve(ocrService);
  if(!ocrPromise){
    ocrPromise=(async()=>{
      const [files, mod] = await Promise.all([loadOcrFiles(), import("./ocr/paddle-ocr.js")]);
      const { PaddleOcrService, ort } = mod;
      ort.env.wasm.wasmPaths = OCR_BASE;
      ort.env.wasm.wasmBinary = files.wasm;
      ort.env.wasm.numThreads = 1;
      if(progressCb) progressCb({phase:"init"});
      const svc = new PaddleOcrService({
        model:{ detection:files.det, recognition:files.rec, charactersDictionary:files.dict },
        detection:{ maxSideLength:960 },
        recognition:{ minimumConfidence:0.2 },
        session:{ executionProviders:["wasm"] },
      });
      await svc.initialize();
      ocrService=svc; return svc;
    })().catch(e=>{ ocrPromise=null; throw e; });
  }
  return ocrPromise;
}

function makeProgress(barEl, labelEl){
  let timer=null, w=0;
  const set=(p,t)=>{ w=p; if(barEl) barEl.style.width=Math.round(p)+"%"; if(labelEl&&t) labelEl.textContent=t; };
  return m=>{
    if(m.phase==="load") set(m.p*60, m.p<1 ? `読み取りの準備中… ${Math.round(m.p*100)}%（初回のみ）` : "準備しています…");
    else if(m.phase==="init") set(62, "準備しています…");
    else if(m.phase==="rec"){ set(65, "認識しています…"); clearInterval(timer); timer=setInterval(()=>set(w+(95-w)*0.06),300); }
    else if(m.phase==="done"){ clearInterval(timer); set(100); }
  };
}

async function fileToCanvas(file){
  if(file.type==="application/pdf"){
    const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    const page = await pdf.getPage(1);
    const vp = page.getViewport({scale:2});
    const c = document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
    return c;
  }
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1, 2000/Math.max(img.width,img.height));   // 大きすぎる写真は縮小して高速化
      const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("画像を開けませんでした")); };
    img.src=url;
  });
}

const SC_MAP={纳:"納",东:"東",额:"額",单:"単",价:"価",样:"様",计:"計",发:"発",书:"書",订:"訂",费:"費",务:"務",总:"総",请:"請",领:"領",货:"貨",运:"運",贩:"販",销:"販",类:"類",项:"項",应:"応",账:"帳",强:"強",纸:"紙"};
function normalizeText(raw){
  // OCRが日本語1文字ごとに空白を入れているときだけ詰める（iPhoneの文字認識の正しい空白は残す）
  const jp=(raw.match(/[^\x00-\x7F]/g)||[]).length, gaps=(raw.match(/[^\x00-\x7F] (?=[^\x00-\x7F])/g)||[]).length;
  if(jp && gaps/jp>0.2) raw=raw.replace(/(?<=[^\x00-\x7F]) (?=[^\x00-\x7F])/g,"");
  return raw
    .replace(/[纳东额单价样计发书订费务总请领货运贩销类项应账强纸]/g,c=>SC_MAP[c])
    .replace(/(?<=\d)一(?=\d)/g,"-")
    .replace(/[０-９Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[，、](?=\d{3})/g,",").replace(/[．]/g,".").replace(/[：]/g,":").replace(/[／]/g,"/").replace(/[－ー−‐](?=\d)/g,"-")
    .replace(/[¥￥]/g,"¥")
    .replace(/\r/g,"");
}
const toInt = s => parseInt(String(s).replace(/,/g,""),10);
function readDate(s){
  const m=s.match(/(\d{2,4})\s*[\/\-年.]\s*(\d{1,2})\s*[\/\-月.]\s*(\d{1,2})/);
  if(!m) return null;
  let y=+m[1]; if(y<100) y+=2000;
  const mo=+m[2], d=+m[3];
  if(y<2015||y>2099||mo<1||mo>12||d<1||d>31) return null;
  const iso=`${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const diff=(new Date(iso)-new Date(today()))/86400000;
  return (diff<-200||diff>40) ? null : iso;
}
function dateAfter(text, labelRe){
  const m=text.match(new RegExp(`(?:${labelRe})[^\\d\\n]{0,8}([\\d]{2,4}\\s*[/\\-年.]\\s*\\d{1,2}\\s*[/\\-月.]\\s*\\d{1,2})`));
  return m ? readDate(m[1]) : null;
}
function parseText(raw){
  const text=normalizeText(raw);
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const r={ items:[] };
  r.supplier = supplierFromText(text);
  r.docType = /品書/.test(text) ? "納品書" : /請求書/.test(text) ? "請求書" : /注文書|注文確認|ご注文内容/.test(text) ? "注文書" : /領収書/.test(text) ? "領収書" : null;

  // 日付（ラベル付きを優先）
  r.orderDate = dateAfter(text,"ご発注日|発注日|ご注文日|注文日|注文確定日");
  r.deliveryDate = dateAfter(text,"納品日|お届け日|到着日|配達日");
  if(!r.orderDate && !r.deliveryDate){
    for(const l of lines){ const d=readDate(l); if(d){ r.orderDate=d; break; } }
  }
  r.date = r.orderDate || r.deliveryDate;

  // 注文・伝票番号
  const om=text.match(/(?:伝?票番号|ご注文番号|注文番号|注文No\.?|オーダー番号|Order\s*(?:No\.?|#|ID)|発注番号|お問い合わせ番号)[\s:：#.]*([A-Z0-9][A-Z0-9\-]{4,24})/i);
  if(om) r.orderNo=om[1];

  // 明細：数量×単価＝金額 になっている数字の並びを拾う（OCRの崩れに強い）
  const codeRe=/^([A-Z0-9]{2,4}-\d{3,5})\s*(.+)$/;
  const codeNames=[]; const byLine=[]; let lastName=null;
  for(const l of lines){
    const cm=l.match(codeRe);
    if(cm && /[ぁ-んァ-ヶ一-龠A-Za-z]{2}/.test(cm[2])){ lastName=cm[2].replace(/\s{2,}/g," ").trim(); codeNames.push(lastName); }
    const nums=(l.match(/\d[\d,]*(?:\.\d+)?/g)||[]).filter(x=>!/\./.test(x)).map(toInt);
    for(let i=0;i+2<nums.length;i++){
      const [q,p,a]=[nums[i],nums[i+1],nums[i+2]];
      if(q>0&&q<10000&&p>0&&a>0&&q*p===a){ byLine.push({name:lastName,qty:q,price:p,amount:a}); lastName=null; break; }
    }
  }
  // 数字が1つずつ改行されて出た場合に備え、全体の並びでも探す
  const bySeq=[]; const toks=(text.match(/\d[\d,]*(?:\.\d+)?/g)||[]).filter(x=>!/\./.test(x)).map(toInt);
  for(let i=0;i+2<toks.length;i++){
    const [q,p,a]=[toks[i],toks[i+1],toks[i+2]];
    if(q>0&&q<10000&&p>=10&&a>=10&&q*p===a){ bySeq.push({name:null,qty:q,price:p,amount:a}); i+=2; }
  }
  r.items = bySeq.length>byLine.length ? bySeq : byLine;
  if(codeNames.length===r.items.length) r.items.forEach((x,i)=>{ x.name=codeNames[i]; });

  // 合計金額（ラベルの後ろ、数行先まで探す）
  const tm=text.match(/(?:合計金額|総合計|ご請求金額|請求金額|お支払(?:い)?金額|税込合計|合計)(?:\(税込\))?[\s\S]{0,40}?(\d{1,3}(?:,\d{3})+|\d{3,})/);
  if(tm) r.amount=toInt(tm[1]);
  const sumItems=r.items.reduce((s,x)=>s+x.amount,0);
  if(r.items.length && (!r.amount || r.amount<sumItems)) r.amount = sumItems;   // ラベルが読めない・明らかに小さいときは明細合計
  if(r.amount==null){
    const ns=[...text.matchAll(/¥\s?([\d,]{3,})|([\d,]{3,})\s?円|(\d{1,3}(?:,\d{3})+)/g)].map(m=>toInt(m[1]||m[2]||m[3])).filter(n=>n>=100&&n<10000000);
    if(ns.length) r.amount=Math.max(...ns);
  }
  r.amountChecked = r.items.length>0 && sumItems===r.amount;

  // 数量
  if(r.items.length) r.quantity=r.items.reduce((s,x)=>s+x.qty,0);
  else { const qm=text.match(/(?:数量|個数)[^\d\n]{0,6}(\d{1,4})/); if(qm) r.quantity=+qm[1]; }

  // 品名
  const named=r.items.filter(x=>x.name);
  if(named.length) r.sName = named[0].name + (r.items.length>1 ? ` 他${r.items.length-1}点` : "");
  else if(codeNames.length) r.sName = codeNames[0] + (codeNames.length>1 ? ` 他${codeNames.length-1}点` : "");
  else {
    const cand=lines.filter(l=>l.length>4&&l.length<60&&/[ぁ-んァ-ヶ一-龠]{2}/.test(l)&&!/合計|小計|送料|税|注文|領収|請求|納品|株式会社|住所|電話|TEL|〒|様|上段|下段|番号|担当|お問い合わせ|ありがとう|サービス|都|区/i.test(l));
    const clean=cand.filter(l=>(l.match(/[ぁ-んァ-ヶ一-龠]/g)||[]).length/l.replace(/\s/g,"").length>0.5);   // 記号だらけの誤認識は使わない
    if(clean.length) r.sName=clean.sort((a,b)=>b.length-a.length)[0];
  }
  return r;
}

function makeFileName(p, origName, suffix=""){
  const code=supplierToCode(p.supplier);
  const date=(p.date||today()).replace(/-/g,"");
  const amt=p.amount!=null ? String(p.amount) : "0";
  const ext=/\.pdf$/i.test(origName||"") ? ".pdf" : (/\.png$/i.test(origName||"") ? ".png" : ".jpg");
  return `${code}-${date}-${amt}${suffix}${ext}`;
}

/* 文字の位置情報から「単価 → 金額」の組を作り、数量は 金額÷単価 で求める（紙が傾いて行が崩れても拾える） */
function parseBoxes(words){
  const W=words.filter(w=>w&&w.box).map(w=>{ const t=normalizeText(w.text).trim(), b=w.box; return {t, x:b.x, r:b.x+b.width, h:b.height, cy:b.y+b.height/2}; });
  const nums=W.filter(w=>/^¥?\d{1,3}(,\d{3})+$|^¥?\d{1,7}$/.test(w.t)).map(w=>({...w, v:toInt(w.t.replace("¥",""))}));
  const usedP=new Set(), usedA=new Set(), items=[];
  [...nums].sort((a,b)=>b.x-a.x).forEach(A=>{
    if(usedP.has(A)||A.v<1) return;
    const c=nums.filter(P=>P!==A&&!usedA.has(P)&&!usedP.has(P)&&P.v>=1&&P.r<=A.x+4&&Math.abs(P.cy-A.cy)<Math.max(P.h,A.h)*0.8&&A.v%P.v===0&&A.v/P.v<=999);
    if(!c.length) return;
    const P=c.sort((a,b)=>b.r-a.r)[0];   // すぐ左にある数字＝単価
    usedA.add(A); usedP.add(P);
    items.push({ qty:A.v/P.v, price:P.v, amount:A.v, cy:A.cy, h:A.h, name:null });
  });
  items.sort((a,b)=>a.cy-b.cy);
  // 品名：商品コード（例 139-655）で始まる文字列
  const names=W.filter(w=>/^[A-Z0-9]{1,4}-\d{2,5}/.test(w.t)&&/[ぁ-んァ-ヶ一-龠]{2}/.test(w.t)).sort((a,b)=>a.cy-b.cy)
    .map(w=>({cy:w.cy, n:w.t.replace(/^[A-Z0-9]{1,4}-\d{2,5}\s*/,"").replace(/\s{2,}/g," ").trim()}));
  if(names.length===items.length) items.forEach((it,i)=>it.name=names[i].n);
  else items.forEach(it=>{ const c=names.filter(n=>!n.used&&n.cy<=it.cy+it.h).pop(); if(c){ c.used=true; it.name=c.n; } });
  // 合計：「合計」などの右（または少し下）にある数字
  let total=null;
  const lab=W.find(w=>/合計|総額|請求金額|お支払/.test(w.t));
  if(lab){
    const right=nums.filter(n=>n.x>lab.x&&Math.abs(n.cy-lab.cy)<Math.max(n.h,lab.h)*0.8).sort((a,b)=>a.x-b.x)[0];
    const below=nums.filter(n=>n.cy>lab.cy&&n.cy-lab.cy<lab.h*2.5&&n.r>lab.x).sort((a,b)=>a.cy-b.cy)[0];
    const m=lab.t.match(/(\d{1,3}(?:,\d{3})+|\d{3,})/);
    total = right ? right.v : m ? toInt(m[1]) : below ? below.v : null;
  }
  return { items:items.map(({cy,h,...x})=>x), total };
}

function parseOcr(text, words){
  const r=parseText(text);
  const b=parseBoxes(words);
  if(b.items.length>=r.items.length && b.items.length){
    r.items=b.items;
    r.quantity=b.items.reduce((s,x)=>s+x.qty,0);
    const named=b.items.filter(x=>x.name);
    if(named.length) r.sName=named[0].name+(b.items.length>1?` 他${b.items.length-1}点`:"");
  }
  const sum=r.items.reduce((s,x)=>s+x.amount,0);
  if(b.total) r.amount=b.total;
  if(r.items.length && (!r.amount || r.amount<sum)) r.amount=sum;
  r.amountChecked = r.items.length>0 && sum===r.amount;
  return r;
}

async function ocrFile(file, cb){
  progressCb = cb;
  try{
    const canvas = await fileToCanvas(file);
    const preview = canvas.toDataURL("image/jpeg",.7);
    const svc = await getOcr();
    if(cb) cb({phase:"rec"});
    const res = await svc.recognize(canvas);
    canvas.width=0; canvas.height=0;
    if(cb) cb({phase:"done"});
    addLog("OCR","端末内（PaddleOCR）",`${(res.text||"").length}文字を読み取り・画像は外部送信なし`);
    return { file, preview, parsed: parseOcr(res.text||"", (res.lines||[]).flat()) };
  } finally { progressCb = null; }
}

function setDl(sel, fname, zone){
  const b=$(sel), f=ocrFiles[zone];
  if(f){
    b.textContent = `${fname} として保存`;
    b.onclick = ()=>{
      const url=URL.createObjectURL(f), a=document.createElement("a");
      a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      addLog("電帳法ファイル保存","端末のダウンロード",fname);
    };
  } else {
    const base=fname.replace(/\.[a-z]+$/i,"");
    b.textContent = `ファイル名をコピー：${base}`;
    b.onclick = async ()=>{
      try{ await navigator.clipboard.writeText(base); toast("ファイル名をコピーしました"); }
      catch(e){ prompt("このファイル名で写真をBOXに保存してください", base); }
    };
  }
}

function resetOcr(zone){
  const z = zone==="order" ? "Order" : "Deliv";
  $(`#ocr${z}Preview`).hidden=true; $(`#ocr${z}Result`).hidden=true; $(`#ocr${z}BarWrap`).hidden=true;
  $(`#ocr${z}Status`).textContent=""; $(`#ocr${z}Img`).removeAttribute("src");
  ocrFiles[zone]=null;
}

function fillOrderFields(p){
  if(p.supplier) setRadio("supplier",p.supplier);
  if(p.amount!=null) $("#iAmt").value=p.amount;
  if(p.quantity!=null) $("#iQty").value=p.quantity;
  if(p.orderDate||p.date) $("#iSDate").value=p.orderDate||p.date;
  if(p.orderNo) $("#iOrderNo").value=p.orderNo;
  if(p.sName && !$("#iSName").value) $("#iSName").value=p.sName;
  if(p.items?.length>1 && !$("#iSMemo").value)
    $("#iSMemo").value = p.items.map(x=>`・${x.name||"（品名不明）"} ×${x.qty} ${yen(x.amount)}`).join("\n");
}
function summary(p){
  return [p.docType, p.supplier, p.orderNo&&`番号 ${p.orderNo}`, p.orderDate&&`発注日 ${p.orderDate}`, p.deliveryDate&&`納品日 ${p.deliveryDate}`,
    p.items?.length&&`明細${p.items.length}点`, p.quantity!=null&&`数量 ${p.quantity}`, p.amount!=null&&`合計 ${yen(p.amount)}${p.amountChecked?"（明細の合計と一致）":""}`].filter(Boolean).join("、");
}
const weak = p => p.amount==null && !p.items?.length;
const WEAK_MSG = "うまく読み取れませんでした。書類全体が明るく、まっすぐ写るように撮り直してください。";
function showPreview(zone, res){
  const z = zone==="order" ? "Order" : "Deliv";
  if(res.preview){ $(`#ocr${z}Img`).src=res.preview; $(`#ocr${z}Preview`).hidden=false; }
  else $(`#ocr${z}Preview`).hidden=true;
}

function applyOrder(res){
  const p=res.parsed;
  fillOrderFields(p);
  showPreview("order", res);
  $("#ocrOrderResultText").textContent = weak(p) ? WEAK_MSG : `自動入力しました：${summary(p)}。内容を確認して保存してください。`;
  ocrFiles.order=res.file||null;
  const suffix = p.docType ? `-${p.docType}` : "";
  setDl("#btnDlOrder", makeFileName({supplier:radioVal("supplier")||p.supplier, date:(p.docType==="納品書"&&p.deliveryDate)||$("#iSDate").value, amount:num($("#iAmt").value)}, res.file?.name, suffix), "order");
  $("#ocrOrderResult").hidden=false; $("#ocrOrderStatus").textContent="読み取り完了";
  // 発注を記録していなかった納品書は、そのまま「受取済」として記録できるようにする
  if(p.docType==="納品書"){
    $("#verifySection").hidden=false;
    if(p.quantity!=null) $("#iDelivQty").value=p.quantity;
    if(p.amount!=null) $("#iDelivAmt").value=p.amount;
    $("#iDelivDate").value=p.deliveryDate||today();
    renderVerify(true);
  }
}

function applyDeliv(res){
  const p=res.parsed;
  if(p.quantity!=null) $("#iDelivQty").value=p.quantity;
  if(p.amount!=null) $("#iDelivAmt").value=p.amount;
  $("#iDelivDate").value = p.deliveryDate || p.date || today();
  if(p.orderNo && !$("#iOrderNo").value) $("#iOrderNo").value=p.orderNo;
  renderVerify(true);
  showPreview("deliv", res);
  $("#ocrDelivResultText").textContent = weak(p) ? WEAK_MSG : `納品書から読み取り：${summary(p)}`;
  ocrFiles.deliv=res.file||null;
  setDl("#btnDlDeliv", makeFileName({supplier:radioVal("supplier")||p.supplier, date:p.deliveryDate||p.date||today(), amount:num($("#iDelivAmt").value)}, res.file?.name, "-納品書"), "deliv");
  $("#ocrDelivResult").hidden=false; $("#ocrDelivStatus").textContent="読み取り完了";
}

/* フォーム内の読み取りボタン */
async function formOcr(file, zone){
  const z = zone==="order" ? "Order" : "Deliv";
  const wrap=$(`#ocr${z}BarWrap`), bar=$(`#ocr${z}Bar`), st=$(`#ocr${z}Status`);
  wrap.hidden=false; bar.style.width="0"; st.textContent="準備しています…";
  try{ const res=await ocrFile(file, makeProgress(bar, st)); zone==="order" ? applyOrder(res) : applyDeliv(res); }
  catch(err){ st.textContent="読み取りに失敗しました"; addLog("OCR失敗","端末内",err.message,false); }
  finally{ wrap.hidden=true; }
}
document.addEventListener("change", e=>{
  const t=e.target, f=t.files?.[0];
  if(!f) return;
  if(t.id==="ocrOrderCamera"||t.id==="ocrOrderFile") formOcr(f,"order");
  else if(t.id==="ocrDelivCamera"||t.id==="ocrDelivFile") formOcr(f,"deliv");
  else if(t.id==="scanCamera"||t.id==="scanFile") scanFlow(f);
  else return;
  t.value="";
});
document.addEventListener("click", e=>{ const b=e.target.closest(".ocr-clear"); if(b) resetOcr(b.dataset.zone); });

/* ===== 撮影画面（QR → 撮影 → 認識 → 入力済みフォーム） ===== */
let scanKind=null, pendingDeliv=null;
const SCAN_TEXT = {
  order: { kicker:"発注", title:"注文書を撮影", desc:"注文書・請求書の全体が入るように撮影してください。購入先・金額・数量などが自動で入力されます。" },
  deliv: { kicker:"納品", title:"納品書を撮影", desc:"届いた納品書を撮影してください。該当する発注を探して、数量・金額を自動で照合します。" },
};
function openScan(kind){
  scanKind=kind;
  const t=SCAN_TEXT[kind];
  $("#scanKicker").textContent=t.kicker; $("#scanTitle").textContent=t.title; $("#scanDesc").textContent=t.desc;
  $("#scanScreen").classList.add("open");
  startCam();
  loadOcrFiles().catch(()=>{});   // 構えている間にモデルを取得（2回目以降は端末内の保存分）
}
function closeScan(){
  stopCam();
  $("#scanScreen").classList.remove("open");
  if(location.search) history.replaceState(null,"",location.pathname);
}

/* ページ内カメラ（標準カメラアプリを呼ばずに映像を直接表示） */
let camStream=null;
function camMessage(text){ const m=$("#camMsg"); m.textContent=text; m.hidden=!text; }
function camFallback(on){
  $("#camBox").hidden=on; $("#camShoot").hidden=on; $("#pickCamera").hidden=on; $("#camFallbackNote").hidden=!on;
  $("#pickPhoto").className = on ? "scan-shoot" : "scan-alt";
  if(on) stopCam();
}
/* 映像が届いても真っ黒のまま（端末側でカメラが止められている）かを確かめる */
async function isBlackFeed(v){
  const c=document.createElement("canvas"); c.width=32; c.height=24; const g=c.getContext("2d",{willReadFrequently:true});
  for(let i=0;i<6;i++){
    await new Promise(r=>setTimeout(r,400));
    if(!camStream) return false;
    g.drawImage(v,0,0,32,24);
    const d=g.getImageData(0,0,32,24).data; let s=0; for(let k=0;k<d.length;k+=4) s+=d[k]+d[k+1]+d[k+2];
    if(s/(d.length/4)/3 > 6) return false;   // 少しでも明るさがあれば映っている
  }
  return true;
}
async function startCam(){
  const shoot=$("#camShoot"); shoot.disabled=true;
  camFallback(false);
  camMessage("カメラを起動しています…");
  if(!navigator.mediaDevices?.getUserMedia){
    addLog("カメラ","この端末","getUserMedia非対応",false); camFallback(true); return;
  }
  try{
    camStream = await navigator.mediaDevices.getUserMedia({ audio:false,
      video:{ facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1440} } });
    if(!$("#scanScreen").classList.contains("open")){ stopCam(); return; }   // 起動待ちの間に閉じられた
    const v=$("#camVideo"); v.srcObject=camStream;
    await v.play().catch(()=>{});
    await new Promise(r=>{ if(v.videoWidth) r(); else v.onloadedmetadata=()=>r(); setTimeout(r,3000); });
    camMessage("カメラを確認しています…");
    if(!v.videoWidth || await isBlackFeed(v)){
      addLog("カメラ","この端末","映像が真っ暗のため写真選択に切り替え",false); camFallback(true); return;
    }
    camMessage(""); shoot.disabled=false;
    addLog("カメラ","この端末",`起動 ${v.videoWidth}×${v.videoHeight}・映像は外部送信なし`);
  }catch(err){
    const why = err.name==="NotAllowedError"
      ? "カメラの使用が許可されていません。iPhoneは「設定→Safari→カメラ」、Androidは「Chromeのサイト設定→カメラ」で許可してから開き直してください。"
      : err.name==="NotFoundError" ? "カメラが見つかりませんでした。"
      : err.name==="NotReadableError" ? "カメラを他のアプリが使っています。他のアプリを閉じてから開き直してください。"
      : `カメラを起動できませんでした（${err.name}）。`;
    addLog("カメラ","この端末",`${err.name}: ${err.message}`,false);
    camFallback(true);
  }
}
function stopCam(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  const v=$("#camVideo"); if(v) v.srcObject=null;
  $("#camShoot").disabled=true;
}
$("#camShoot").onclick=()=>{
  const v=$("#camVideo"); if(!v.videoWidth) return;
  const c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);
  c.toBlob(b=>{
    c.width=0; c.height=0;
    if(!b) return;
    const d=today().replace(/-/g,""), f=new File([b], `scan-${d}.jpg`, {type:"image/jpeg"});
    scanFlow(f);
  }, "image/jpeg", .92);
};
document.addEventListener("visibilitychange",()=>{
  if(!$("#scanScreen").classList.contains("open")) return;
  if(document.hidden) stopCam(); else startCam();
});
$("#scanCancel").onclick=closeScan;
$$("[data-scan]").forEach(b=>b.onclick=()=>openScan(b.dataset.scan));

async function scanFlow(file){
  const kind=scanKind; closeScan();
  mode="supply"; render();
  $("#busyBar").style.width="0"; $("#busyTitle").textContent="準備しています…";
  $("#busy").classList.add("open");
  let res;
  try{ res = await ocrFile(file, makeProgress($("#busyBar"), $("#busyTitle"))); }
  catch(err){
    $("#busy").classList.remove("open");
    addLog("OCR失敗","端末内",err.message,false);
    alert("読み取りに失敗しました。もう一度撮影してください。");
    openScan(kind); return;
  }
  $("#busy").classList.remove("open");
  if(kind==="order"){
    openForm({logType:"supply"}, {title:"発注を記録"});
    applyOrder(res);
  } else routeDeliv(res);
}

/* 納品書 → 該当する発注を探す */
function findCandidates(p){
  return logs.filter(l=>l.logType==="supply" && l.status!=="受取済").map(l=>{
    let s=0;
    if(p.orderNo && l.orderNo && p.orderNo.replace(/-/g,"")===l.orderNo.replace(/-/g,"")) s+=100;
    if(p.supplier && l.supplier===p.supplier) s+=20;
    if(p.amount!=null && l.amount!=null && Number(l.amount)===p.amount) s+=40;
    if(p.quantity!=null && l.quantity!=null && Number(l.quantity)===p.quantity) s+=10;
    return {l,s};
  }).sort((a,b)=>b.s-a.s || (b.l.date||"").localeCompare(a.l.date||""));
}
function routeDeliv(res){
  const c=findCandidates(res.parsed);
  const top=c[0], second=c[1];
  if(top && (top.s>=100 || (top.s>=60 && (!second || second.s<top.s)))){
    openDelivFor(top.l, res); return;
  }
  pendingDeliv=res;
  const p=res.parsed;
  const info=[p.supplier, p.amount!=null&&yen(p.amount), p.quantity!=null&&`${p.quantity}個`].filter(Boolean).join("・");
  $("#pickInfo").textContent = (info ? `納品書の読み取り結果：${info}。` : "") + (c.length ? "照合する発注を選んでください。" : "未受取の発注がありません。");
  $("#pickList").innerHTML = c.slice(0,8).map(({l})=>`
    <button class="pick-row" type="button" data-id="${esc(l.id)}">
      <span class="t">${esc(l.sName||"（品名未入力）")}</span><span class="s">${fmtDate(l.date)}</span>
      <span class="s">${esc([l.supplier, l.quantity!=null&&`${l.quantity}個`, l.amount!=null&&yen(l.amount)].filter(Boolean).join(" · "))}</span><span></span>
    </button>`).join("");
  $("#pickOverlay").classList.add("open");
}
function openDelivFor(log, res){
  openForm(log, {title:"納品を照合", verify:true});
  applyDeliv(res);
  $("#verifySection").scrollIntoView({block:"start", behavior:"smooth"});
}
$("#pickList").addEventListener("click", e=>{
  const b=e.target.closest(".pick-row"); if(!b||!pendingDeliv) return;
  const l=logs.find(x=>x.id===b.dataset.id);
  $("#pickOverlay").classList.remove("open");
  if(l) openDelivFor(l, pendingDeliv);
  pendingDeliv=null;
});
$("#pickNew").onclick=()=>{
  if(!pendingDeliv) return;
  const res=pendingDeliv; pendingDeliv=null;
  $("#pickOverlay").classList.remove("open");
  openForm({logType:"supply"}, {title:"納品を記録", verify:true});
  fillOrderFields(res.parsed);
  applyDeliv(res);
};
$("#pickClose").onclick=()=>{ pendingDeliv=null; $("#pickOverlay").classList.remove("open"); };

/* ===== Excel ===== */
$("#btnExcel").onclick=()=>{
  if(!logs.length){ alert("データがありません"); return; }
  const wb=XLSX.utils.book_new();
  const dRows=logs.filter(l=>l.logType!=="supply"), sRows=logs.filter(l=>l.logType==="supply");
  const wsD=XLSX.utils.aoa_to_sheet([
    ["日付","種別","手続き","部署","担当者","端末番号","機種","状態","メモ"],
    ...dRows.map(r=>[r.date||"",r.category||"",r.action||"",r.dept||"",r.name||"",r.number||"",r.model||"",r.status||"",r.memo||""])
  ]);
  wsD["!cols"]=[10,10,10,8,12,14,16,8,24].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,wsD,"端末・ライセンス");
  const wsS=XLSX.utils.aoa_to_sheet([
    ["注文日","品名","購入先","部署","注文数量","注文金額","注文番号","到着日","納品数量","納品金額","照合","状態","メモ"],
    ...sRows.map(r=>[r.date||"",r.sName||"",r.supplier||"",r.dept||"",r.quantity??"",r.amount??"",r.orderNo||"",r.deliveryDate||"",r.delivQty??"",r.delivAmt??"",(r.delivQty==null&&r.delivAmt==null)?"":(hasDiff(r)?"差異あり":"一致"),r.status||"",r.sMemo||""])
  ]);
  wsS["!cols"]=[10,24,12,8,8,10,16,10,8,10,8,8,24].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,wsS,"備品・消耗品");
  XLSX.writeFile(wb,`手続き備品ログ_${today().replace(/-/g,"")}.xlsx`);
  addLog("Excel出力","端末のダウンロード",`端末${dRows.length}件・備品${sRows.length}件`);
};

/* ===== 通信ログ ===== */
const commLog=[];
function addLog(type,dest,detail,ok=true){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  commLog.unshift({ts:`${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`,type,dest,detail,ok});
  if(commLog.length>100) commLog.length=100;
}
$("#btnLog").onclick=()=>{
  $("#logList").innerHTML = commLog.map(c=>`
    <div style="display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px">
      <span style="color:var(--text-muted);white-space:nowrap">${c.ts}</span>
      <div><span style="color:${c.ok?"var(--accent)":"var(--danger)"}">${esc(c.type)}</span><span style="color:var(--text-muted)"> → ${esc(c.dest)}</span>
      <div style="color:var(--text-muted)">${esc(c.detail)}</div></div>
    </div>`).join("") || '<p class="note">まだ操作はありません</p>';
  $("#logOverlay").classList.add("open");
};

/* ===== QR ===== */
const QR_TARGETS = {
  order: { q:"?scan=order", desc:"読み取るとすぐに注文書の撮影画面が開きます。", file:"QR_発注" },
  deliv: { q:"?scan=deliv", desc:"読み取るとすぐに納品書の撮影画面が開きます。", file:"QR_納品" },
  top:   { q:"",            desc:"一覧画面が開きます。", file:"QR_一覧" },
};
let qrKind="order";
function drawQr(){
  const t=QR_TARGETS[qrKind], url=location.origin+location.pathname+t.q;
  $("#qrcode").innerHTML="";
  new QRCode($("#qrcode"),{text:url,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});
  $("#qrDesc").textContent=t.desc; $("#qrUrl").textContent=url;
  $$("#qrSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.q===qrKind));
}
$$("#qrSeg button").forEach(b=>b.onclick=()=>{ qrKind=b.dataset.q; drawQr(); });
$("#btnQr").onclick=()=>{ drawQr(); $("#qrOverlay").classList.add("open"); };
$("#qrSave").onclick=()=>{
  const c=$("#qrcode canvas"); if(!c) return;
  const a=document.createElement("a"); a.href=c.toDataURL("image/png"); a.download=QR_TARGETS[qrKind].file+".png"; a.click();
};

/* オーバーレイを閉じる */
[["#logOverlay","#logClose"],["#qrOverlay","#qrClose"]].forEach(([ov,cl])=>{
  $(cl).onclick=()=>$(ov).classList.remove("open");
  $(ov).addEventListener("click",e=>{ if(e.target===e.currentTarget) e.currentTarget.classList.remove("open"); });
});

/* ===== 起動 ===== */
if(typeof pdfjsLib!=="undefined") pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
lsLoad();
const startScan = new URLSearchParams(location.search).get("scan");
if(startScan==="order"||startScan==="deliv"){ mode="supply"; render(); openScan(startScan); }
else { render(); }
/* 認識エンジンは撮影後に読み込む（先に読み込むとスマホのカメラが真っ暗になることがあるため） */
addLog("起動","この端末","記録はこの端末内のみ・外部サーバーへの送信なし");
</script>
